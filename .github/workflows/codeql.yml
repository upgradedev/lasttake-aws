name: codeql

# Static analysis on every push, plus a weekly sweep so a newly published rule
# finds old code rather than waiting for someone to touch it.
#
# The `security-extended` suite is on deliberately. The default suite is tuned
# for signal on a large codebase; this one is small enough to read every finding,
# and a product whose whole claim is "absent evidence is a finding" should not
# run the quieter ruleset on itself.
#
# Two separate things broke when this repository was made private, and they
# looked like one.
#
# The first is a permission. The action reads its own workflow run through the
# API, which needs `actions: read` on a private repository and nothing on a
# public one. Without it the step fails with "Resource not accessible by
# integration" *after* the analysis has finished and the SARIF has been written,
# which reads like an analysis failure and is not one.
#
# The second is an entitlement. Uploading results to the Security tab needs
# GitHub Advanced Security on a private repository, and that cannot be granted
# from here.
#
# The analysis still runs either way. What changes is where the result goes: to
# the Security tab when the account allows it, and to a build artifact plus a
# loud notice when it does not. A finding is never suppressed, the SARIF is
# always produced and always downloadable, and the moment the repository is
# public this reverts to uploading with no edit here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  # Needed on a private repository and not on a public one, which is why this
  # job went red the day the repository was made private and not before. The
  # action reads its own workflow run through the API, and without this the call
  # returns "Resource not accessible by integration" and the step fails after
  # the analysis has already succeeded. The SARIF was being produced correctly
  # the whole time.
  actions: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Can this account receive code scanning results at all
        id: entitlement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # 403 with "Code scanning is not enabled" is the entitlement being
          # absent. Anything else, including a 200 and including an unexpected
          # error, is treated as available so a real problem still surfaces.
          body="$(gh api "repos/${GITHUB_REPOSITORY}/code-scanning/alerts" 2>&1 || true)"
          if printf '%s' "$body" | grep -qi "code scanning is not enabled"; then
            echo "upload=never" >>"$GITHUB_OUTPUT"
            echo "entitled=false" >>"$GITHUB_OUTPUT"
            echo "Code scanning is not enabled on this repository." >&2
          else
            echo "upload=always" >>"$GITHUB_OUTPUT"
            echo "entitled=true" >>"$GITHUB_OUTPUT"
          fi

      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        id: analyse
        with:
          category: "/language:python"
          upload: ${{ steps.entitlement.outputs.upload }}
          output: sarif

      - name: Keep the result where a human can read it
        if: always() && steps.entitlement.outputs.entitled == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: sarif
          retention-days: 90

      - name: Fail on any finding, since nothing is reading the Security tab
        if: steps.entitlement.outputs.entitled == 'false'
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee -a "${GITHUB_STEP_SUMMARY}"
          import glob, json, pathlib

          print("## CodeQL ran, and its results were not uploaded")
          print()
          print("Code scanning needs GitHub Advanced Security on a private repository and this")
          print("one is private until the owner makes it public. The analysis below is the same")
          print("`security-extended` run as always; only the destination changed. The SARIF is")
          print("attached to this run as `codeql-sarif`.")
          print()

          total = 0
          for path in sorted(glob.glob("sarif/*.sarif")):
              report = json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
              for run in report.get("runs", []):
                  results = run.get("results", [])
                  total += len(results)
                  for item in results[:25]:
                      rule = item.get("ruleId", "unknown rule")
                      where = ""
                      locations = item.get("locations") or []
                      if locations:
                          physical = locations[0].get("physicalLocation", {})
                          artifact = physical.get("artifactLocation", {}).get("uri", "")
                          line = physical.get("region", {}).get("startLine", "")
                          where = f"{artifact}:{line}"
                      message = item.get("message", {}).get("text", "")
                      print(f"- `{rule}` {where}: {message}")

          print()
          if total:
              print(f"**{total} finding(s).** Failing the job, because with no Security tab to")
              print("read there is nowhere else for these to be seen.")
              raise SystemExit(1)
          print("**No findings.** The suite ran and returned nothing.")
          PY
