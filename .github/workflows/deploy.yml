name: deploy

# Deploys the live URL, then proves the two claims that cannot be proved
# offline: that a Strands interrupt survives a real process boundary on
# S3-backed sessions, and that the Bedrock path actually runs.
#
# `teardown` is a separate, manually triggered job. Gate D2 asks for a pipeline
# that builds from nothing and tears everything down, and asks that it has been
# run at least once end to end.

on:
  workflow_dispatch:
    inputs:
      action:
        description: deploy, teardown, or lifecycle (build a throwaway copy, check it, destroy it)
        type: choice
        options: [deploy, teardown, lifecycle]
        default: deploy
  push:
    branches: [main]
    paths:
      - "src/**"
      - "corpus/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: lasttake-deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  STACK: lasttake-app

jobs:
  deploy:
    if: inputs.action != 'teardown' && inputs.action != 'lifecycle'
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.stack.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      # Until the owner has run infra/setup_ci_identity.py there is nothing to
      # deploy with. Say so and stop, rather than failing with a credentials
      # error that reads like a defect in the build.
      - name: are there credentials to deploy with
        id: gate
        env:
          KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "$KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Deploy skipped: no AWS credentials yet"
              echo ""
              echo "Run \`python infra/setup_ci_identity.py\` once, then set"
              echo "\`AWS_ACCESS_KEY_ID\` and \`AWS_SECRET_ACCESS_KEY\` as repository secrets."
              echo "Nothing is broken; there is simply nothing to deploy with."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: who am I, and what can I reach
        if: steps.gate.outputs.ready == 'true'
        run: |
          aws sts get-caller-identity
          echo "--- anthropic models this account can invoke ---"
          aws bedrock list-inference-profiles \
            --query "inferenceProfileSummaries[?contains(inferenceProfileId,'anthropic')].inferenceProfileId" \
            --output text | tr '\t' '\n' | head -30

      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build the deployment package
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          rm -rf build && mkdir -p build/pkg
          # arm64 wheels, to match the Lambda architecture in the template.
          python -m pip install \
            --platform manylinux2014_aarch64 \
            --implementation cp --python-version 3.12 --only-binary=:all: \
            --target build/pkg \
            "strands-agents>=1.53.0" "pydantic>=2.7" "psycopg[binary]>=3.2"
          cp -r src/lasttake build/pkg/lasttake
          mkdir -p build/pkg/corpus && cp corpus/*.json build/pkg/corpus/
          # boto3 is in the Lambda runtime already; shipping it wastes 15MB.
          rm -rf build/pkg/boto3 build/pkg/botocore build/pkg/**/__pycache__ || true
          find build/pkg -name "*.dist-info" -prune -exec rm -rf {} + || true
          find build/pkg -name "__pycache__" -prune -exec rm -rf {} + || true
          cd build/pkg && zip -qr ../lasttake.zip . && cd ../..
          ls -lh build/lasttake.zip

      - name: upload the package, content addressed
        if: steps.gate.outputs.ready == 'true'
        id: code
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="lasttake-deploy-${ACCOUNT}-${AWS_REGION}"
          aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null || \
            aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
          aws s3api put-public-access-block --bucket "$BUCKET" \
            --public-access-block-configuration \
            "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          SHA=$(sha256sum build/lasttake.zip | cut -c1-16)
          KEY="builds/lasttake-${SHA}.zip"
          aws s3 cp build/lasttake.zip "s3://${BUCKET}/${KEY}"
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: deploy the stack
        if: steps.gate.outputs.ready == 'true'
        id: stack
        run: |
          set -euo pipefail
          # A stack that failed on its very first create sits in ROLLBACK_COMPLETE
          # and cannot be updated, only replaced. Delete it so a corrected
          # template deploys without a human opening the console.
          STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK" \
                     --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo NONE)
          # Two states a first create can leave behind, and neither can be
          # updated in place. ROLLBACK_COMPLETE is a create that ran and failed.
          # REVIEW_IN_PROGRESS is a changeset that was created and never
          # executed, which is what an early-validation failure leaves; it is
          # easy to miss because `describe-stacks` still returns the stack, so a
          # cleanup that only looks for "absent or rolled back" walks straight
          # past it.
          case "$STATUS" in
            ROLLBACK_COMPLETE|REVIEW_IN_PROGRESS)
              echo "stack is in $STATUS and cannot be updated, only replaced; deleting it"
              aws cloudformation delete-stack --stack-name "$STACK"
              aws cloudformation wait stack-delete-complete --stack-name "$STACK"
              STATUS=NONE
              ;;
          esac

          # The data bucket carries DeletionPolicy: Retain, which is right when it
          # holds an audit trail and wrong when a first create never got as far as
          # writing one. A retained bucket outlives the stack that made it, so
          # this check is deliberately NOT nested inside the branch above: with no
          # stack, any lasttake-data bucket is by definition an orphan.
          #
          # It is removed ONLY when provably empty: zero versions and zero delete
          # markers. A bucket holding anything is left exactly where it is and the
          # deploy fails instead, because a pipeline that deletes evidence to make
          # itself go green is worse than a pipeline that stays red.
          if [ "$STATUS" = "NONE" ]; then
            ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
            DATA="lasttake-data-${ACCOUNT}-${AWS_REGION}"
            if aws s3api head-bucket --bucket "$DATA" >/dev/null 2>&1; then
              # Two queries added in the shell. JMESPath has no arithmetic, so the
              # obvious one-liner is a runtime error, not a syntax error, and it
              # surfaces at exactly the wrong moment.
              V=$(aws s3api list-object-versions --bucket "$DATA" \
                    --query "length(Versions || \`[]\`)" --output text)
              D=$(aws s3api list-object-versions --bucket "$DATA" \
                    --query "length(DeleteMarkers || \`[]\`)" --output text)
              echo "orphaned $DATA holds $V version(s) and $D delete marker(s)"
              if [ "$((V + D))" = "0" ]; then
                echo "it is empty, so removing it lets the create proceed"
                aws s3api delete-bucket --bucket "$DATA" --region "$AWS_REGION"
              else
                echo "it is not empty and is being left alone. Adopt it into the"
                echo "stack or empty it deliberately. This pipeline will not delete"
                echo "an audit trail to make a deploy succeed."
                exit 1
              fi
            fi
          fi
          aws cloudformation deploy \
            --template-file infra/stack.yaml \
            --stack-name "$STACK" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              CodeBucket=${{ steps.code.outputs.bucket }} \
              CodeKey=${{ steps.code.outputs.key }} \
              CommitSha=${{ github.sha }}
          URL=$(aws cloudformation describe-stacks --stack-name "$STACK" \
                 --query "Stacks[0].Outputs[?OutputKey=='LiveUrl'].OutputValue" --output text)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "LIVE URL: $URL"
          {
            echo "## LastTake is live"
            echo ""
            echo "**$URL**"
            echo ""
            echo "Deployed SHA \`${{ github.sha }}\`. Compare against the repository head before recording anything."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: the URL answers, and it is the commit we just built
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          URL="${{ steps.stack.outputs.url }}"
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            [ "$CODE" = "200" ] && break
            echo "attempt $i: $CODE, waiting"; sleep 6
          done
          echo "GET / -> $CODE"
          [ "$CODE" = "200" ] || { echo "the judge URL does not answer"; exit 1; }
          curl -s "${URL}healthz" | tee /dev/stderr | grep -q '"ok": true'

          # Assert which store is actually behind the run state. Without this
          # the DSQL fallback to S3 is invisible: everything still works, and
          # the architecture quietly is not the one the README describes.
          curl -s "${URL}healthz" | grep -q '"run_state_store": "aurora-dsql"' || {
            echo "run state is NOT on Aurora DSQL. The stack set no endpoint, or the"
            echo "function fell back to S3. Refusing to call this deployed."
            exit 1
          }
          echo "run state is on Aurora DSQL"

      # The claim that could not be proved offline. Two HTTP requests are two
      # Lambda invocations. The first stops the run at the 1st AD and ends. The
      # second, with no memory of the first, resumes it from S3.
      - name: 'the hero, on the deployed architecture'
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          URL="${{ steps.stack.outputs.url }}"
          RUN="ci-$(date +%s)-$(head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          echo "run id: $RUN"

          # Read back from the stack rather than reconstructing the names here,
          # so this step cannot drift away from what was actually deployed.
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK" \
                     --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)
          BUS=$(aws cloudformation describe-stacks --stack-name "$STACK" \
                  --query "Stacks[0].Outputs[?OutputKey=='EventBusName'].OutputValue" --output text)
          MODEL="global.anthropic.claude-sonnet-5"

          echo "=== request 1 of 2: fire the checkpoint ==="
          R1=$(curl -sS -X POST "${URL}api/checkpoint" -H 'content-type: application/json' \
                 -d "{\"run_id\":\"$RUN\"}")
          echo "$R1" | python -c "
          import json,sys
          d=json.load(sys.stdin)
          assert d.get('headline'), d
          print(d['headline'])
          print('counts:', json.dumps(d['counts']))
          p=d.get('pending_approval')
          assert p, 'the run did not stop for the 1st AD'
          print('stopped for:', p['reason'].get('required_role'), 'on', p['reason'].get('beat_id'))
          print('served by container', d['served_by']['container_id'], 'request', d['served_by']['lambda_request_id'])
          open('/tmp/pending','w').write(p['id'])
          open('/tmp/c1','w').write(d['served_by']['container_id'])
          assert d['counts']['covered_with_evidence'] == 31, d['counts']
          "

          echo
          echo "=== between the two: force a new execution environment ==="
          # Lambda may reuse a warm container, and when it does the two requests
          # are served by one process, which proves nothing about surviving
          # process death. Any configuration change retires every existing
          # execution environment, so the approval below runs in a process that
          # did not exist when the run stopped. This stands in for seven and a
          # half hours passing.
          #
          # It changes the DESCRIPTION and nothing else, deliberately. The first
          # version of this step passed `--environment`, which **replaces** the
          # whole variable set rather than merging into it, and silently dropped
          # `LASTTAKE_DSQL_ENDPOINT`. The function then ran on S3 while every
          # other check still passed, and CloudFormation could not see the drift
          # because it compares the template against its own stored state, not
          # against reality. A test helper that rewrites deployed configuration
          # is a configuration change wearing a costume.
          aws lambda update-function-configuration \
            --function-name "lasttake-api-${ACCOUNT_ID}" \
            --description "LastTake API. Cold start forced at $(date -u +%FT%TZ) to prove the resume crosses a process boundary." \
            --query 'LastUpdateStatus' --output text
          aws lambda wait function-updated-v2 --function-name "lasttake-api-${ACCOUNT_ID}"
          echo "every warm container has been retired"

          # And prove it did not disturb anything, rather than assuming.
          curl -sS "${URL}healthz" | grep -q '"run_state_store": "aurora-dsql"' || {
            echo "forcing the cold start changed the deployed configuration. Stop."
            exit 1
          }
          echo "configuration intact: run state is still on Aurora DSQL"

          echo
          echo "=== request 2 of 2: a separate invocation approves ==="
          R2=$(curl -sS -X POST "${URL}api/approve" -H 'content-type: application/json' \
                 -d "{\"run_id\":\"$RUN\",\"interrupt_id\":\"$(cat /tmp/pending)\",\"approve\":true}")
          echo "$R2" | python -c "
          import json,sys
          d=json.load(sys.stdin)
          print(d['message'])
          assert 'Pickup approved' in d['message'], d['message']
          c1=open('/tmp/c1').read(); c2=d['served_by']['container_id']
          print('container that stopped the run: ', c1)
          print('container that resumed it:      ', c2)
          assert c1 != c2, (
              'the approval was served by the same container, so this run does not '
              'demonstrate crossing a process boundary'
          )
          print()
          print('Different containers. The process that stopped the run at the 1st AD no')
          print('longer existed when the approval arrived, and the run continued from the')
          print('same point because it was rebuilt from S3.')
          "

          echo
          echo "=== the rest of the loop ==="
          curl -sS -X POST "${URL}api/late-take" -H 'content-type: application/json' \
            -d "{\"run_id\":\"$RUN\"}" | python -c "
          import json,sys; d=json.load(sys.stdin); print(d['headline']); print('affected:', d['affected_checks'])"
          curl -sS -X POST "${URL}api/resolve-rights" -H 'content-type: application/json' \
            -d "{\"run_id\":\"$RUN\"}" | python -c "
          import json,sys; d=json.load(sys.stdin); print(d['headline']); print('affected:', d['affected_checks'])"

      - name: 'the query object storage could not answer'
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          URL="${{ steps.stack.outputs.url }}"
          echo "Every run with an open exception, across scenes, from one SQL query:"
          curl -sS "${URL}api/blocked" | python -c "
          import json,sys
          d=json.load(sys.stdin)
          assert 'blocked' in d, d
          for row in d['blocked'][:10]:
              print(f\"  {row['run_id']}: {row['open_exceptions']} open across \"
                    f\"{row['departments_involved']} department(s)\")
          print(f\"{len(d['blocked'])} run(s) currently blocked\")
          "

      # The last claim in this repository that had never executed. The two
      # bounded interpretations are the only place a language model is allowed,
      # and until this ran they were code written from documentation.
      #
      # It runs a full checkpoint through `BedrockInterpreter`, so every
      # coverage and continuity finding on this run carries a real model's
      # judgement, and asserts the count is the same one the offline
      # interpreter produces. That equality is the point: the model is allowed
      # to explain, never to decide, so swapping it must not move the number.
      - name: 'the Strands to Bedrock path, actually run'
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python -m pip install --quiet -e .
          export LASTTAKE_WORKDIR="$RUNNER_TEMP/bedrock-run"
          export AWS_REGION="${AWS_REGION}"

          echo "--- what this account can invoke ---"
          lasttake doctor --bedrock | tail -20

          echo
          echo "--- a checkpoint whose interpretations come from Bedrock ---"
          lasttake checkpoint --bedrock | tee "$RUNNER_TEMP/bedrock.log"

          python - <<'PY'
          import json, os, pathlib, sys
          work = pathlib.Path(os.environ["LASTTAKE_WORKDIR"])
          findings = json.loads(
              (work / "runs" / "run-sc042-wrap-checkpoint" / "findings.json").read_text()
          )
          interpreted = [f for f in findings if f.get("inference")]
          assert interpreted, "no finding carried a model inference"
          versions = {f["agent_version"] for f in interpreted}
          print(f"{len(interpreted)} finding(s) carry a Bedrock inference")
          print("one of them, verbatim:")
          sample = interpreted[0]
          print(f"  {sample['requirement_id']}: {sample['inference'][:220]}")
          # A model may not claim certainty. The contract enforces it, and this
          # is the deployed proof that the real model obeys it too.
          for f in interpreted:
              assert f["confidence"] < 1.0, f
          print("every model-touched finding reports confidence below 1.0")
          PY

          grep -q "Of 34 required beats, 31 covered with evidence" "$RUNNER_TEMP/bedrock.log" || {
            echo "the count moved when the interpreter changed. The model is deciding"
            echo "something it must not decide, or the gate is reading it wrong."
            exit 1
          }
          echo "the count is unchanged: the model explains, the policy decides"

      - name: 'Bedrock, invoked for real from the deployed role'
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          aws bedrock-runtime converse \
            --model-id "global.anthropic.claude-sonnet-5" \
            --messages '[{"role":"user","content":[{"text":"Reply with exactly: OK"}]}]' \
            --inference-config '{"maxTokens":16}' \
            --query '{reply:output.message.content[0].text,usage:usage}' --output json

      - name: what this costs when nobody is looking
        if: steps.gate.outputs.ready == 'true'
        run: |
          echo "Lambda: billed per request. No requests, no charge."
          echo "Function URL: no hourly charge."
          echo "S3: a few hundred KB per run at 0.023 USD per GB-month."
          echo "EventBridge: 1.00 USD per million custom events."
          echo "Idle monthly cost is dominated by S3 storage and rounds to under 0.01 USD."
          echo "Measured from the AWS pricing pages on the date in STATE.md, not estimated here."

  # Gate D2 asks for a pipeline that builds from nothing and tears everything
  # down, and asks that it has actually been run end to end. Doing that against
  # the live stack would change the URL a judge has been given, because the API
  # Gateway id is generated. So it runs against a throwaway copy of the same
  # template, under a different name prefix, and the live stack is never touched.
  #
  # It is the same template, the same pipeline and the same assertions. What
  # differs is one parameter.
  lifecycle:
    if: inputs.action == 'lifecycle'
    runs-on: ubuntu-latest
    env:
      EPH_STACK: lasttake-app-ephemeral
      EPH_PREFIX: lasttake-eph
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: refuse to run against anything that is not the throwaway copy
        run: |
          set -euo pipefail
          # The whole point of this job is that it destroys what it creates. If
          # the names ever drift onto the real stack, it would destroy that
          # instead. Cheap check, catastrophic thing to get wrong.
          [ "$EPH_STACK" != "$STACK" ] || { echo "ephemeral stack name equals the live one"; exit 1; }
          [ "$EPH_PREFIX" != "lasttake" ] || { echo "ephemeral prefix equals the live one"; exit 1; }
          echo "will build and destroy $EPH_STACK with prefix $EPH_PREFIX"
          echo "the live stack $STACK is not referenced by this job"

      - name: build the package
        run: |
          set -euo pipefail
          rm -rf build && mkdir -p build/pkg
          python -m pip install \
            --platform manylinux2014_aarch64 \
            --implementation cp --python-version 3.12 --only-binary=:all: \
            --target build/pkg \
            "strands-agents>=1.53.0" "pydantic>=2.7" "psycopg[binary]>=3.2"
          cp -r src/lasttake build/pkg/lasttake
          mkdir -p build/pkg/corpus && cp corpus/*.json build/pkg/corpus/
          rm -rf build/pkg/boto3 build/pkg/botocore || true
          find build/pkg -name "*.dist-info" -prune -exec rm -rf {} + || true
          find build/pkg -name "__pycache__" -prune -exec rm -rf {} + || true
          cd build/pkg && zip -qr ../lasttake.zip . && cd ../..

      - name: 1 of 3, build it from nothing
        id: build
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="lasttake-deploy-${ACCOUNT}-${AWS_REGION}"
          SHA=$(sha256sum build/lasttake.zip | cut -c1-16)
          KEY="builds/lasttake-${SHA}.zip"
          aws s3 cp build/lasttake.zip "s3://${BUCKET}/${KEY}" >/dev/null

          # Nothing may exist beforehand, or "from nothing" is not what happened.
          STATUS=$(aws cloudformation describe-stacks --stack-name "$EPH_STACK" \
                     --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" != "NONE" ]; then
            echo "a previous ephemeral stack is still present in $STATUS; removing it first"
            aws cloudformation delete-stack --stack-name "$EPH_STACK"
            aws cloudformation wait stack-delete-complete --stack-name "$EPH_STACK"
          fi

          aws cloudformation deploy \
            --template-file infra/stack.yaml \
            --stack-name "$EPH_STACK" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              CodeBucket="$BUCKET" \
              CodeKey="$KEY" \
              NamePrefix="$EPH_PREFIX" \
              CommitSha=${{ github.sha }}

          URL=$(aws cloudformation describe-stacks --stack-name "$EPH_STACK" \
                  --query "Stacks[0].Outputs[?OutputKey=='LiveUrl'].OutputValue" --output text)
          EPHEMERAL=$(aws cloudformation describe-stacks --stack-name "$EPH_STACK" \
                  --query "Stacks[0].Outputs[?OutputKey=='IsEphemeral'].OutputValue" --output text)
          [ "$EPHEMERAL" = "yes" ] || { echo "the stack does not consider itself ephemeral"; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "built $EPH_STACK at $URL"

      - name: 2 of 3, it actually works
        run: |
          set -euo pipefail
          # The same journey the uptime check walks against the live URL. A
          # teardown proof that never confirmed the thing worked would be a
          # proof that CloudFormation can delete an empty stack.
          python tools/uptime_check.py "${{ steps.build.outputs.url }}"

      - name: 3 of 3, tear everything down
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)

          # Read what the stack owns before deleting it. Both the bucket and the
          # cluster carry DeletionPolicy: Retain, so CloudFormation leaves them
          # behind on purpose and this job has to finish the job.
          DATA=$(aws cloudformation describe-stacks --stack-name "$EPH_STACK" \
                   --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)
          CLUSTER=$(aws cloudformation describe-stacks --stack-name "$EPH_STACK" \
                   --query "Stacks[0].Outputs[?OutputKey=='DatabaseIdentifier'].OutputValue" --output text)

          case "$DATA" in
            "$EPH_PREFIX"-*) ;;
            *) echo "refusing: $DATA is not an ephemeral bucket"; exit 1 ;;
          esac

          aws cloudformation delete-stack --stack-name "$EPH_STACK"
          aws cloudformation wait stack-delete-complete --stack-name "$EPH_STACK"
          echo "stack deleted"

          if aws s3api head-bucket --bucket "$DATA" >/dev/null 2>&1; then
            aws s3 rm "s3://$DATA" --recursive >/dev/null 2>&1 || true
            python - "$DATA" <<'PY'
          import sys, boto3
          bucket = sys.argv[1]
          assert bucket.startswith("lasttake-eph-"), bucket
          s3 = boto3.client("s3")
          paginator = s3.get_paginator("list_object_versions")
          for page in paginator.paginate(Bucket=bucket):
              objects = [
                  {"Key": o["Key"], "VersionId": o["VersionId"]}
                  for key in ("Versions", "DeleteMarkers")
                  for o in page.get(key, [])
              ]
              if objects:
                  s3.delete_objects(Bucket=bucket, Delete={"Objects": objects})
          print(f"emptied {bucket}")
          PY
            aws s3api delete-bucket --bucket "$DATA" --region "$AWS_REGION"
            echo "bucket deleted"
          fi

          if [ -n "$CLUSTER" ] && [ "$CLUSTER" != "None" ]; then
            aws dsql delete-cluster --identifier "$CLUSTER" --region "$AWS_REGION" >/dev/null
            echo "cluster $CLUSTER deleting"
          fi

      - name: nothing ephemeral is left, and the live stack is untouched
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          LEFT=$(aws cloudformation list-stacks \
                   --stack-status-filter CREATE_COMPLETE UPDATE_COMPLETE ROLLBACK_COMPLETE REVIEW_IN_PROGRESS \
                   --query "StackSummaries[?StackName=='${EPH_STACK}'].StackName" --output text)
          [ -z "$LEFT" ] || { echo "the ephemeral stack survived teardown"; exit 1; }
          BUCKETS=$(aws s3api list-buckets --query "Buckets[?starts_with(Name,'${EPH_PREFIX}-')].Name" --output text)
          [ -z "$BUCKETS" ] || { echo "ephemeral buckets survived: $BUCKETS"; exit 1; }

          # And the thing this job must never break.
          LIVE=$(aws cloudformation describe-stacks --stack-name "$STACK" \
                   --query "Stacks[0].StackStatus" --output text)
          [ "$LIVE" = "CREATE_COMPLETE" ] || [ "$LIVE" = "UPDATE_COMPLETE" ] || {
            echo "the live stack is in $LIVE"; exit 1; }
          echo "torn down cleanly; the live stack is still $LIVE"
          {
            echo "## Gate D2: build from nothing, verify, destroy"
            echo ""
            echo "Built \`$EPH_STACK\`, walked the whole judge journey against it, destroyed"
            echo "the stack, the bucket and the cluster. The live stack is untouched and"
            echo "still \`$LIVE\`."
          } >> "$GITHUB_STEP_SUMMARY"

  teardown:
    if: inputs.action == 'teardown'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: delete the stack
        run: |
          set -euo pipefail
          aws cloudformation delete-stack --stack-name "$STACK"
          aws cloudformation wait stack-delete-complete --stack-name "$STACK"
          echo "stack deleted. The data bucket is retained on purpose: it holds"
          echo "the audit trail, and a teardown that destroys the audit trail is"
          echo "not a teardown, it is a cover-up. Empty it deliberately if you"
          echo "actually want it gone."
