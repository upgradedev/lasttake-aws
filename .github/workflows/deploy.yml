name: deploy

# Deploys the live URL, then proves the two claims that cannot be proved
# offline: that a Strands interrupt survives a real process boundary on
# S3-backed sessions, and that the Bedrock path actually runs.
#
# `teardown` is a separate, manually triggered job. Gate D2 asks for a pipeline
# that builds from nothing and tears everything down, and asks that it has been
# run at least once end to end.

on:
  workflow_dispatch:
    inputs:
      action:
        description: deploy or teardown
        type: choice
        options: [deploy, teardown]
        default: deploy
  push:
    branches: [main]
    paths:
      - "src/**"
      - "corpus/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: lasttake-deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  STACK: lasttake-app

jobs:
  deploy:
    if: inputs.action != 'teardown'
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.stack.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      # Until the owner has run infra/setup_ci_identity.py there is nothing to
      # deploy with. Say so and stop, rather than failing with a credentials
      # error that reads like a defect in the build.
      - name: are there credentials to deploy with
        id: gate
        env:
          KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "$KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Deploy skipped: no AWS credentials yet"
              echo ""
              echo "Run \`python infra/setup_ci_identity.py\` once, then set"
              echo "\`AWS_ACCESS_KEY_ID\` and \`AWS_SECRET_ACCESS_KEY\` as repository secrets."
              echo "Nothing is broken; there is simply nothing to deploy with."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: who am I, and what can I reach
        if: steps.gate.outputs.ready == 'true'
        run: |
          aws sts get-caller-identity
          echo "--- anthropic models this account can invoke ---"
          aws bedrock list-inference-profiles \
            --query "inferenceProfileSummaries[?contains(inferenceProfileId,'anthropic')].inferenceProfileId" \
            --output text | tr '\t' '\n' | head -30

      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build the deployment package
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          rm -rf build && mkdir -p build/pkg
          # arm64 wheels, to match the Lambda architecture in the template.
          python -m pip install \
            --platform manylinux2014_aarch64 \
            --implementation cp --python-version 3.12 --only-binary=:all: \
            --target build/pkg \
            "strands-agents>=1.53.0" "pydantic>=2.7"
          cp -r src/lasttake build/pkg/lasttake
          mkdir -p build/pkg/corpus && cp corpus/*.json build/pkg/corpus/
          # boto3 is in the Lambda runtime already; shipping it wastes 15MB.
          rm -rf build/pkg/boto3 build/pkg/botocore build/pkg/**/__pycache__ || true
          find build/pkg -name "*.dist-info" -prune -exec rm -rf {} + || true
          find build/pkg -name "__pycache__" -prune -exec rm -rf {} + || true
          cd build/pkg && zip -qr ../lasttake.zip . && cd ../..
          ls -lh build/lasttake.zip

      - name: upload the package, content addressed
        if: steps.gate.outputs.ready == 'true'
        id: code
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="lasttake-deploy-${ACCOUNT}-${AWS_REGION}"
          aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null || \
            aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
          aws s3api put-public-access-block --bucket "$BUCKET" \
            --public-access-block-configuration \
            "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          SHA=$(sha256sum build/lasttake.zip | cut -c1-16)
          KEY="builds/lasttake-${SHA}.zip"
          aws s3 cp build/lasttake.zip "s3://${BUCKET}/${KEY}"
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: deploy the stack
        if: steps.gate.outputs.ready == 'true'
        id: stack
        run: |
          set -euo pipefail
          # A stack that failed on its very first create sits in ROLLBACK_COMPLETE
          # and cannot be updated, only replaced. Delete it so a corrected
          # template deploys without a human opening the console.
          STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK" \
                     --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" = "ROLLBACK_COMPLETE" ]; then
            echo "stack is in ROLLBACK_COMPLETE from a failed first create; deleting it"
            aws cloudformation delete-stack --stack-name "$STACK"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK"
          fi
          aws cloudformation deploy \
            --template-file infra/stack.yaml \
            --stack-name "$STACK" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              CodeBucket=${{ steps.code.outputs.bucket }} \
              CodeKey=${{ steps.code.outputs.key }} \
              CommitSha=${{ github.sha }}
          URL=$(aws cloudformation describe-stacks --stack-name "$STACK" \
                 --query "Stacks[0].Outputs[?OutputKey=='LiveUrl'].OutputValue" --output text)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "LIVE URL: $URL"
          {
            echo "## LastTake is live"
            echo ""
            echo "**$URL**"
            echo ""
            echo "Deployed SHA \`${{ github.sha }}\`. Compare against the repository head before recording anything."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: the URL answers, and it is the commit we just built
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          URL="${{ steps.stack.outputs.url }}"
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            [ "$CODE" = "200" ] && break
            echo "attempt $i: $CODE, waiting"; sleep 6
          done
          echo "GET / -> $CODE"
          [ "$CODE" = "200" ] || { echo "the judge URL does not answer"; exit 1; }
          curl -s "${URL}healthz" | tee /dev/stderr | grep -q '"ok": true'

      # The claim that could not be proved offline. Two HTTP requests are two
      # Lambda invocations. The first stops the run at the 1st AD and ends. The
      # second, with no memory of the first, resumes it from S3.
      - name: 'the hero, on the deployed architecture'
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          URL="${{ steps.stack.outputs.url }}"
          RUN="ci-$(date +%s)-$(head -c4 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          echo "run id: $RUN"

          echo "=== request 1 of 2: fire the checkpoint ==="
          R1=$(curl -sS -X POST "${URL}api/checkpoint" -H 'content-type: application/json' \
                 -d "{\"run_id\":\"$RUN\"}")
          echo "$R1" | python -c "
          import json,sys
          d=json.load(sys.stdin)
          assert d.get('headline'), d
          print(d['headline'])
          print('counts:', json.dumps(d['counts']))
          p=d.get('pending_approval')
          assert p, 'the run did not stop for the 1st AD'
          print('stopped for:', p['reason'].get('required_role'), 'on', p['reason'].get('beat_id'))
          print('served by container', d['served_by']['container_id'], 'request', d['served_by']['lambda_request_id'])
          open('/tmp/pending','w').write(p['id'])
          open('/tmp/c1','w').write(d['served_by']['container_id'])
          assert d['counts']['covered_with_evidence'] == 31, d['counts']
          "

          echo
          echo "=== request 2 of 2: a separate invocation approves ==="
          R2=$(curl -sS -X POST "${URL}api/approve" -H 'content-type: application/json' \
                 -d "{\"run_id\":\"$RUN\",\"interrupt_id\":\"$(cat /tmp/pending)\",\"approve\":true}")
          echo "$R2" | python -c "
          import json,sys
          d=json.load(sys.stdin)
          print(d['message'])
          assert 'Pickup approved' in d['message'], d['message']
          c1=open('/tmp/c1').read(); c2=d['served_by']['container_id']
          print('container on request 1:', c1)
          print('container on request 2:', c2)
          print('same container' if c1==c2 else 'DIFFERENT container, so a different process entirely')
          print('The run was rebuilt from S3 either way; nothing was held in memory between the two.')
          "

          echo
          echo "=== the rest of the loop ==="
          curl -sS -X POST "${URL}api/late-take" -H 'content-type: application/json' \
            -d "{\"run_id\":\"$RUN\"}" | python -c "
          import json,sys; d=json.load(sys.stdin); print(d['headline']); print('affected:', d['affected_checks'])"
          curl -sS -X POST "${URL}api/resolve-rights" -H 'content-type: application/json' \
            -d "{\"run_id\":\"$RUN\"}" | python -c "
          import json,sys; d=json.load(sys.stdin); print(d['headline']); print('affected:', d['affected_checks'])"

      - name: 'Bedrock, invoked for real from the deployed role'
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          aws bedrock-runtime converse \
            --model-id "global.anthropic.claude-sonnet-5" \
            --messages '[{"role":"user","content":[{"text":"Reply with exactly: OK"}]}]' \
            --inference-config '{"maxTokens":16}' \
            --query '{reply:output.message.content[0].text,usage:usage}' --output json

      - name: what this costs when nobody is looking
        if: steps.gate.outputs.ready == 'true'
        run: |
          echo "Lambda: billed per request. No requests, no charge."
          echo "Function URL: no hourly charge."
          echo "S3: a few hundred KB per run at 0.023 USD per GB-month."
          echo "EventBridge: 1.00 USD per million custom events."
          echo "Idle monthly cost is dominated by S3 storage and rounds to under 0.01 USD."
          echo "Measured from the AWS pricing pages on the date in STATE.md, not estimated here."

  teardown:
    if: inputs.action == 'teardown'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: delete the stack
        run: |
          set -euo pipefail
          aws cloudformation delete-stack --stack-name "$STACK"
          aws cloudformation wait stack-delete-complete --stack-name "$STACK"
          echo "stack deleted. The data bucket is retained on purpose: it holds"
          echo "the audit trail, and a teardown that destroys the audit trail is"
          echo "not a teardown, it is a cover-up. Empty it deliberately if you"
          echo "actually want it gone."
