# Copied from upgradedev/archon-datahub, master a1feb16,
# .github/workflows/submission-video.yml. Pristine copy at
# video/upstream/archon-datahub/submission-video.yml.
#
# LastTake adaptation: owner-gated source only; no candidate recording exists.
name: Generate exact-release submission video

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact deployed SHA to record
        required: true
        type: string
      hosted_run_id:
        description: Successful LastTake frontend release and live acceptance run, optional
        required: false
        type: string
      governed_run_id:
        description: Successful LastTake backend deployment proof for the release, optional
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: submission-video-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  video:
    name: Capture, compose and verify the judge video
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LASTTAKE_RELEASE_SHA: ${{ inputs.release_sha }}
      LASTTAKE_HOSTED_RUN_ID: ${{ inputs.hosted_run_id }}
      LASTTAKE_GOVERNED_RUN_ID: ${{ inputs.governed_run_id }}
    steps:
      - name: Bind media to successful exact-release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "upgradedev/lasttake-aws"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_SHA}" = "${LASTTAKE_RELEASE_SHA}"
          [[ "${LASTTAKE_RELEASE_SHA}" =~ ^[a-f0-9]{40}$ ]]
          # Optional proof IDs must name the exact successful release workflows.
          if [[ -n "${LASTTAKE_HOSTED_RUN_ID}" ]]; then
            [[ "${LASTTAKE_HOSTED_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${LASTTAKE_HOSTED_RUN_ID}" --jq .head_sha)" = "${LASTTAKE_RELEASE_SHA}"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${LASTTAKE_HOSTED_RUN_ID}" --jq .conclusion)" = success
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${LASTTAKE_HOSTED_RUN_ID}" --jq .path)" = ".github/workflows/frontend-deploy.yml"
          fi
          if [[ -n "${LASTTAKE_GOVERNED_RUN_ID}" ]]; then
            [[ "${LASTTAKE_GOVERNED_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${LASTTAKE_GOVERNED_RUN_ID}" --jq .head_sha)" = "${LASTTAKE_RELEASE_SHA}"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${LASTTAKE_GOVERNED_RUN_ID}" --jq .conclusion)" = success
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${LASTTAKE_GOVERNED_RUN_ID}" --jq .path)" = ".github/workflows/deploy.yml"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail closed until the owner configures narration and verifies this capture
        run: |
          python3 - <<'PY'
          import json
          spec=json.load(open("video/narration.json"))
          assert spec.get("recording_status") == "READY_OWNER_VERIFIED", (
              "NOT_CONFIGURED: owner must supply narration credentials, verify the exact live release, "
              "review the current capture and timing, then explicitly set recording_status to READY_OWNER_VERIFIED. "
              "No recording exists for this candidate; no media provider was called."
          )
          PY
      - name: Create one runner-temp media root
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/lasttake-submission-video"
          test ! -e "${root}"
          mkdir -m 0700 "${root}"
          echo "LASTTAKE_VIDEO_ROOT=${root}" >>"${GITHUB_ENV}"
      # Non-AWS cloud authentication from the original kit is not configured here.
      - name: Install ephemeral media tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          echo "FFMPEG=$(command -v ffmpeg)" >>"${GITHUB_ENV}"
          echo "FFPROBE=$(command -v ffprobe)" >>"${GITHUB_ENV}"
      - name: Generate measured narration and captions
        # Owner-provided credentials are required after explicit preflight approval.
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 video/generate-narration.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install exact browser dependencies
        run: npm ci --prefix web --ignore-scripts
      - name: Install ephemeral Chromium
        run: npx --prefix web playwright install --with-deps chromium
      - name: Record the real production journey
        working-directory: web
        run: node video/capture-production.mjs
      - name: Compose and independently probe the final media
        run: python3 video/build-video.py
      - name: Validate the upload package
        run: |
          set -euo pipefail
          output="${LASTTAKE_VIDEO_ROOT}/output"
          # Must match video/build-video.py.
          mp4="lasttake-demo.mp4"
          test -s "${output}/${mp4}"
          test -s "${output}/captions.en.srt"
          # Scene count matches the seven narration/capture beats.
          jq -e \
            --arg sha "${LASTTAKE_RELEASE_SHA}" \
            '.schemaVersion == "lasttake.submission-video-receipt/v1"
             and .releaseSha == $sha
             and .durationSeconds >= 90
             and .durationSeconds < 179
             and .width == 1920
             and .height == 1080
             and .sceneCount == 7
             and (.sha256 | test("^[a-f0-9]{64}$"))
             and .bytes > 1000000' \
            "${output}/video-receipt.json" >/dev/null
          if [[ -n "${LASTTAKE_HOSTED_RUN_ID}" ]]; then
            jq -e --argjson hosted "${LASTTAKE_HOSTED_RUN_ID}" '.hostedRunId == $hosted' \
              "${output}/video-receipt.json" >/dev/null
          fi
          if [[ -n "${LASTTAKE_GOVERNED_RUN_ID}" ]]; then
            jq -e --argjson governed "${LASTTAKE_GOVERNED_RUN_ID}" '.governedRunId == $governed' \
              "${output}/video-receipt.json" >/dev/null
          fi
          test "$(sha256sum "${output}/${mp4}" | awk '{print $1}')" = \
            "$(jq -er .sha256 "${output}/video-receipt.json")"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lasttake-submission-video-${{ inputs.release_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/lasttake-submission-video/output/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Remove runner media
        if: always() && env.LASTTAKE_VIDEO_ROOT != ''
        run: |
          set -euo pipefail
          test "${LASTTAKE_VIDEO_ROOT}" = "${RUNNER_TEMP}/lasttake-submission-video"
          rm -rf -- "${LASTTAKE_VIDEO_ROOT}"
      - name: Require a clean source checkout
        if: always()
        run: test -z "$(git status --porcelain)"
