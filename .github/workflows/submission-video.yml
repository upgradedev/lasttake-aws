# Adapted from upgradedev/archon-datahub, master a1feb16. No pristine upstream
# copy is vendored here. Final production is owner-gated and exact-release bound.
name: Generate exact-release submission video

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact deployed frontend SHA to record
        required: true
        type: string
      hosted_run_id:
        description: Successful LastTake frontend release and live acceptance run
        required: true
        type: string
      governed_run_id:
        description: Successful LastTake backend deployment proof run
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: submission-video-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  video:
    name: Capture, compose and verify the judge video
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LASTTAKE_RELEASE_SHA: ${{ inputs.release_sha }}
      LASTTAKE_HOSTED_RUN_ID: ${{ inputs.hosted_run_id }}
      LASTTAKE_GOVERNED_RUN_ID: ${{ inputs.governed_run_id }}
    steps:
      - name: Bind media to successful exact-release evidence
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "upgradedev/lasttake-aws"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_SHA}" = "${LASTTAKE_RELEASE_SHA}"
          [[ "${LASTTAKE_RELEASE_SHA}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${LASTTAKE_HOSTED_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${LASTTAKE_GOVERNED_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          # release_proof.py binds .github/workflows/frontend-deploy.yml and
          # .github/workflows/deploy.yml proofs to their observed SHAs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail closed until the owner approves narration and timing for capture
        run: |
          python3 - <<'PY'
          import json
          spec=json.load(open("video/narration.json"))
          assert spec.get("recording_status") == "READY_OWNER_VERIFIED", (
              "NOT_CONFIGURED: owner must supply narration credentials, verify the exact live release, "
              "approve the narration, measured timing and live journey for capture, then explicitly set "
              "recording_status to READY_OWNER_VERIFIED. "
              "No recording exists for this candidate; no media provider was called."
          )
          PY
      - name: Create one runner-temp media root
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/lasttake-submission-video"
          test ! -e "${root}"
          mkdir -m 0700 "${root}"
          echo "LASTTAKE_VIDEO_ROOT=${root}" >>"${GITHUB_ENV}"
      - name: Verify the frontend and backend pair before media production
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 video/release_proof.py before
      # Non-AWS cloud authentication from the original kit is not configured here.
      - name: Install ephemeral media tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          echo "FFMPEG=$(command -v ffmpeg)" >>"${GITHUB_ENV}"
          echo "FFPROBE=$(command -v ffprobe)" >>"${GITHUB_ENV}"
      - name: Restore per-beat narration cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/lasttake-submission-video/narration
          key: ${{ runner.os }}-lasttake-narration-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-lasttake-narration-v2-
      - name: Generate measured narration and captions
        # Owner-provided credentials are required after explicit preflight approval.
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          LASTTAKE_NARRATION_MODE: final
        run: python3 video/generate-narration.py
      - name: Save per-beat narration cache
        if: always() && env.LASTTAKE_VIDEO_ROOT != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/lasttake-submission-video/narration
          key: ${{ runner.os }}-lasttake-narration-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install exact browser dependencies
        run: npm ci --prefix web --ignore-scripts
      - name: Install ephemeral Chromium
        run: npx --prefix web playwright install --with-deps chromium
      - name: Record the real production journey
        id: capture
        working-directory: web
        run: node video/capture-production.mjs
      - name: Verify the same frontend and backend pair after recording
        if: always() && steps.capture.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 video/release_proof.py after
      - name: Compose and independently probe the final media
        run: python3 video/build-video.py
      - name: Verify continuous picture, narration, captions and receipts
        run: python3 scripts/verify_video_sync.py
      - name: Validate the upload package
        run: |
          set -euo pipefail
          output="${LASTTAKE_VIDEO_ROOT}/output"
          # Must match video/build-video.py.
          mp4="lasttake-demo.mp4"
          test -s "${output}/${mp4}"
          test -s "${output}/captions.en.srt"
          test -s "${output}/timing.json"
          test -s "${output}/caption-windows.json"
          # Scene count matches the seven narration/capture beats.
          jq -e \
            --arg sha "${LASTTAKE_RELEASE_SHA}" \
            --arg backend "$(jq -er .backendSha "${LASTTAKE_VIDEO_ROOT}/release-before.json")" \
            '.schemaVersion == "lasttake.submission-video-receipt/v1"
             and .releaseSha == $sha
             and .backendSha == $backend
             and .durationSeconds >= 90
             and .durationSeconds < 179
             and .width == 1920
             and .height == 1080
             and .sceneCount == 7
             and (.sha256 | test("^[a-f0-9]{64}$"))
             and (.captureSha256 | test("^[a-f0-9]{64}$"))
             and (.timingSha256 | test("^[a-f0-9]{64}$"))
             and (.captionWindowsSha256 | test("^[a-f0-9]{64}$"))
             and (.captionsSha256 | test("^[a-f0-9]{64}$"))
             and (.narrationSourceSha256 | test("^[a-f0-9]{64}$"))
             and .bytes > 1000000' \
            "${output}/video-receipt.json" >/dev/null
          jq -e --argjson hosted "${LASTTAKE_HOSTED_RUN_ID}" '.hostedRunId == $hosted' \
            "${output}/video-receipt.json" >/dev/null
          jq -e --argjson governed "${LASTTAKE_GOVERNED_RUN_ID}" '.governedRunId == $governed' \
            "${output}/video-receipt.json" >/dev/null
          test "$(sha256sum "${output}/${mp4}" | awk '{print $1}')" = \
            "$(jq -er .sha256 "${output}/video-receipt.json")"
          test "$(sha256sum "${output}/timing.json" | awk '{print $1}')" = \
            "$(jq -er .timingSha256 "${output}/video-receipt.json")"
          test "$(sha256sum "${output}/caption-windows.json" | awk '{print $1}')" = \
            "$(jq -er .captionWindowsSha256 "${output}/video-receipt.json")"
          test "$(sha256sum "${output}/captions.en.srt" | awk '{print $1}')" = \
            "$(jq -er .captionsSha256 "${output}/video-receipt.json")"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lasttake-submission-video-${{ inputs.release_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lasttake-submission-video/output/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Retain release observations even when recording fails
        if: always() && env.LASTTAKE_VIDEO_ROOT != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lasttake-video-release-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lasttake-submission-video/release-*.json
          if-no-files-found: warn
          retention-days: 90
      - name: Remove runner media
        if: always() && env.LASTTAKE_VIDEO_ROOT != ''
        run: |
          set -euo pipefail
          test "${LASTTAKE_VIDEO_ROOT}" = "${RUNNER_TEMP}/lasttake-submission-video"
          rm -rf -- "${LASTTAKE_VIDEO_ROOT}"
      - name: Require a clean source checkout
        if: always()
        run: test -z "$(git status --porcelain)"
