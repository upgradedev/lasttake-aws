name: ci



on:

  push:

    branches: [main, "build/**", "codex/**"]

  pull_request:

  workflow_dispatch:
    inputs:
      evaluation_plan:
        description: 'Exact reviewed private evaluation plan. Empty means source-only.'
        type: string
        default: ''

permissions:
  contents: read



jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5

        with:

          python-version: "3.12"



      - name: install

        run: |

          python -m pip install --upgrade pip

          python -m pip install -e ".[dev]"

          python -m pip show strands-agents | head -3



      - name: the corpus is reproducible from its generator

        run: |

          python corpus/build_corpus.py

          git diff --exit-code -- corpus/ || {

            echo "corpus/ differs from what build_corpus.py produces. Regenerate and commit."

            exit 1

          }



      - name: tests and coverage

        run: |

          python -m pytest --durations=20 --cov --cov-report=term-missing --cov-fail-under=85



      - name: Fixed text development evidence, offline only after instrument tests
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
        run: python tools/model_evidence.py --output source-evidence/model-evidence

      - name: Export bounded collector requests and inert cost plan, no credentials or calls
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
        run: python tools/bounded_model_evidence.py export --output source-evidence/bounded-export

      - name: Retain bounded source export, never an activation grant
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-collector-source-${{ github.sha }}-${{ github.run_id }}
          path: source-evidence/bounded-export/
          if-no-files-found: warn
          retention-days: 90
          overwrite: false

      - name: Export offline supervisor control receipts
        run: |
          python -m pytest tests/test_evaluation_runner.py --junitxml=source-evidence/supervisor-junit.xml
          python tools/evaluation_runner.py template --output source-evidence/supervisor-plan

      - name: Retain supervisor source controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-supervisor-source-${{ github.sha }}-${{ github.run_id }}
          path: |
            source-evidence/supervisor-junit.xml
            source-evidence/supervisor-plan/
          if-no-files-found: warn
          retention-days: 90

      - name: Retain text evidence including failed or unrun slots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: text-development-evidence-${{ github.sha }}-${{ github.run_id }}
          path: source-evidence/model-evidence/
          if-no-files-found: warn
          retention-days: 90
          overwrite: false

      - name: secret scan

        run: python tools/secret_scan.py --all-history



      - name: no other competition is named in judge-facing files

        run: |

          if grep -rEin "cockroach|backblaze|qwen|nebius|xprize|kaggle|gemini|vertex ai" \

               README.md docs/ src/ corpus/ 2>/dev/null; then

            echo "a judge-facing file names another sponsor or competition"; exit 1

          fi

          echo "clean"

      - name: judge-facing prose does not read as generated
        run: python tools/prose_gate.py

  lambda-package:
    name: arm64 Lambda package (source only)
    # This branch artifact is not a release. No AWS credentials or deploy steps.
    if: github.ref == 'refs/heads/codex/security-boundaries-20260910' || github.ref == 'refs/heads/codex/history-pagination-20260910'
    needs: [test, hero]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve the existing deployment recipe for arm64
        run: |
          set -euo pipefail
          mkdir -p build/lambda-deps
          python -m pip install \
            --platform manylinux2014_aarch64 \
            --implementation cp --python-version 3.12 --only-binary=:all: \
            --target build/lambda-deps --report build/lambda-dependencies.json \
            "strands-agents>=1.53.0" "pydantic>=2.7" "psycopg[binary]>=3.2" "boto3>=1.34"
      - name: Package exact source and corpus with checksums
        run: python tools/package_lambda.py --dependencies build/lambda-deps --report build/lambda-dependencies.json --output build/lambda-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: lasttake-lambda-arm64-${{ github.sha }}-${{ github.run_attempt }}
          path: build/lambda-artifact/
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  evaluation-parent:
    # Not activated by push/PR, empty input, public visibility or absent approval.
    # The environment and model-only role are prerequisites, not created here.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.repository.private == true && github.run_attempt == 1 &&
      inputs.evaluation_plan != '' && vars.LASTTAKE_EVAL_APPROVED_PLAN_SHA256 != ''
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: lasttake-bounded-evaluation
    concurrency:
      group: lasttake-bounded-evaluation
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      LASTTAKE_EVAL_PLAN_JSON: ${{ inputs.evaluation_plan }}
      LASTTAKE_EVAL_APPROVED_PLAN_SHA256: ${{ vars.LASTTAKE_EVAL_APPROVED_PLAN_SHA256 }}
      LASTTAKE_EVAL_ROLE_ARN: ${{ vars.LASTTAKE_EVAL_ROLE_ARN }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing dependencies on CI only
        run: python -m pip install -e .
      - name: Validate all fixed budget slices and exact run before credentials
        run: python tools/evaluation_runner.py preflight --output evaluation-run
      - name: Consume this slice once, preserving cancellation and unknown outcomes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/evaluation_runner.py reserve --output evaluation-run
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LASTTAKE_EVAL_ROLE_ARN }}
          aws-region: eu-west-1
          role-duration-seconds: 900
          retry-max-attempts: 1
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"bedrock:InvokeModel",
            "Resource":["arn:aws:bedrock:eu-west-1:*:inference-profile/eu.anthropic.claude-opus-5",
            "arn:aws:bedrock:eu-*::foundation-model/anthropic.claude-opus-5"]}]}
      - name: One supervised cohort; no replacement after timeout or cancellation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/evaluation_runner.py run --output evaluation-run
      - name: Recover available evidence offline only
        if: always()
        run: python tools/evaluation_runner.py recover --output evaluation-run
      - name: Preserve approved plan, consumed reservation, raw outputs and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-run-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evaluation-run/
          retention-days: 90
          if-no-files-found: warn
          overwrite: false

  hero:
    name: interrupt survives process death
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install -e .

      # Each `run:` is a separate OS process. That is the whole point: the
      # approval below is given by a process that did not exist when the run
      # stopped, exactly as a 1st AD approving at 06:40 would be.
      - name: 'process 1  ·  23:10, the checkpoint stops at the 1st AD'
        run: lasttake checkpoint

      - name: what survived on disk between the two processes
        run: find .lasttake/sessions -type f | sort

      # The control runs while the interrupt is still pending. Run after
      # process 2 it could not fail: the only interrupt was already answered,
      # so the CLI said "Nothing is waiting for a decision." with or without a
      # session on disk. Here the token is read first, the way process 2 reads
      # it, and passed explicitly, so the session is the only thing missing and
      # the refusal has to come from Strands finding no paused run. Then the
      # session goes back, and the workdir must be byte for byte what process 1
      # left before process 2 resumes it.
      - name: 'negative control  ·  move the session aside, resume must FAIL'
        run: |
          token=$(python -c 'from pathlib import Path; from lasttake.cli import _latest_interrupt_id; print(_latest_interrupt_id(Path(".lasttake/sessions")) or "")')
          case "$token" in
            v1:*) echo "pending interrupt: $token" ;;
            *) echo "NEGATIVE CONTROL FAILED: process 1 left no pending interrupt to withhold."; exit 1 ;;
          esac
          find .lasttake -type f -exec sha256sum {} + | sort > "$RUNNER_TEMP/workdir.before"

          mv .lasttake/sessions "$RUNNER_TEMP/sessions.aside"
          status=0
          lasttake approve --yes --interrupt-id "$token" > "$RUNNER_TEMP/control.out" 2> "$RUNNER_TEMP/control.err" || status=$?
          cat "$RUNNER_TEMP/control.out"
          cat "$RUNNER_TEMP/control.err" >&2

          if [ "$status" -eq 0 ]; then
            echo "NEGATIVE CONTROL FAILED: resumed with the session moved aside."
            exit 1
          fi
          if grep -q "Nothing is waiting" "$RUNNER_TEMP/control.err" || ! grep -q "not in interrupt state" "$RUNNER_TEMP/control.err"; then
            echo "NEGATIVE CONTROL FAILED: exit $status, but not because the session was missing."
            exit 1
          fi

          # The refused attempt starts an empty session of its own. Clear it,
          # or the real one would be moved inside it rather than over it.
          rm -rf .lasttake/sessions
          mv "$RUNNER_TEMP/sessions.aside" .lasttake/sessions
          if ! find .lasttake -type f -exec sha256sum {} + | sort | diff "$RUNNER_TEMP/workdir.before" -; then
            echo "NEGATIVE CONTROL FAILED: after the restore, the workdir is not the one process 1 left."
            exit 1
          fi
          echo "NEGATIVE CONTROL HELD: with the session moved aside, Strands refused to resume (exit $status). The session is back for process 2."

      - name: 'process 2  ·  06:40, a new process resumes the same run'
        run: lasttake approve --yes --hours 7.5

      - name: 'the late take arrives, and only the affected checks rerun'
        run: lasttake late-take --beat B-17

      - name: 'production supplies the missing release'
        run: lasttake resolve rights --subject BG-07

      - name: the event log, end to end
        run: lasttake events
