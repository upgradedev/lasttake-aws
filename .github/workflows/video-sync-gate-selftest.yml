# Adapted from upgradedev/archon-qwen-memoryagent, 603349c. No pristine
# upstream copy is vendored here. This version exercises LastTake's continuous
# seven-scene capture rather than the earlier four-card composition.
name: Video Sync Gate Selftest

# Guards the guard. scripts/verify_video_sync.py measures the shipped MP4,
# stream durations, seven scene holds, caption windows, sampled pixels and
# receipt hashes. The production workflow cannot upload media until it passes.
#
# The selftest renders inert synthetic media, proves one good package passes,
# then proves order, offset, capture, caption, duration and receipt mutations
# fail for the expected reason. It makes no provider or product request.
on:
  push:
    paths:
      - "scripts/verify_video_sync.py"
      - "tests/video/verify_gate_selftest.py"
      - ".github/workflows/video-sync-gate-selftest.yml"
  pull_request:
    paths:
      - "scripts/verify_video_sync.py"
      - "tests/video/verify_gate_selftest.py"
      - ".github/workflows/video-sync-gate-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.15"

      - name: Ensure ffmpeg
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Selftest — continuous sync must pass good media and fail drift
        run: |
          set -euo pipefail
          python tests/video/verify_gate_selftest.py
