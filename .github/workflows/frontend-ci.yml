name: frontend-ci
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_source_benchmark:
        description: Run the preregistered20-slot source-only hero cohort after verification
        type: boolean
        default: false
        required: false
      archive_previous_acceptance:
        description: Preserve the fixed historical acceptance artifact only if no archive exists
        type: boolean
        default: false
        required: false
  workflow_call:
permissions:
  contents: read
jobs:
  source-hero-benchmark:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.run_source_benchmark == true && github.ref == 'refs/heads/codex/hero-measurement-20260910'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_DEFAULT_REGION: eu-west-1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use existing locked dependencies in CI only
        run: |
          npm install --global npm@11.19.1
          npm ci --prefix frontend
          python -m pip install -e '.[dev]'
      - name: Build source frontend and install existing Chromium runtime
        working-directory: frontend
        run: |
          npm run build
          python ../.github/scripts/install-playwright-chromium.py
      - name: One fixed cohort with durable timeout retention, no retries or recordings
        working-directory: frontend
        run: timeout --signal=KILL 1200s node scripts/run-hero-benchmark.mjs
      - name: Seal an isolated snapshot even if a detached producer survived the driver
        if: always()
        working-directory: frontend
        run: |
          node --input-type=module -e "import {sealSnapshot} from './scripts/hero-measurement.mjs'; const summary=sealSnapshot('test-results/hero-benchmark','test-results/hero-benchmark-final','WORKFLOW_PROCESS_TERMINATED'); if(summary.counts.PASSED!==20) process.exitCode=1;"
      - name: Retain every raw slot and source identity even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-hero-measurement-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/test-results/hero-benchmark-final/
          retention-days: 90
          if-no-files-found: error
          overwrite: false
  archive-previous-acceptance:
    # First preserved in run 34375838628, artifact 10113819181.
    # Manual opt-in only; the immutable archive lookup also prevents duplicates.
    if: github.event_name == 'workflow_dispatch' && inputs.archive_previous_acceptance == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    concurrency:
      group: lasttake-evidence-archive-10107569851
      cancel-in-progress: false
    steps:
      - name: Preserve the fixed accepted artifact as inert bytes
        id: archive
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const repo = context.repo;
            if (`${repo.owner}/${repo.repo}` !== 'upgradedev/lasttake-aws') throw new Error('Unexpected repository');
            const name = 'preserved-aws-acceptance-34359050749-10107569851';
            const previous = await github.paginate(github.rest.actions.listArtifactsForRepo, {...repo, name, per_page: 100});
            if (previous.some(a => a.name === name && !a.expired)) {
              core.notice('Fixed source artifact already archived; intentionally skipping repeated archival.');
              core.setOutput('needed', 'false');
              return;
            }
            const run = (await github.rest.actions.getWorkflowRun({...repo, run_id: 34359050749})).data;
            const source = (await github.rest.actions.getArtifact({...repo, artifact_id: 10107569851})).data;
            if (run.head_sha !== '78e91cbad29f1511c4e7be2b5eac4f55e308acd6' || run.conclusion !== 'success' ||
                source.workflow_run?.id !== run.id || source.expired || source.name !== 'aws-acceptance-34359050749' ||
                source.size_in_bytes > 300000000) throw new Error('Fixed source provenance or size check failed');
            const downloaded = await github.rest.actions.downloadArtifact({...repo, artifact_id: source.id, archive_format: 'zip'});
            const bytes = Buffer.from(downloaded.data);
            const root = path.join(process.env.RUNNER_TEMP, 'lasttake-previous-acceptance');
            fs.mkdirSync(root, {recursive: false});
            fs.writeFileSync(path.join(root, 'original-artifact.zip'), bytes, {flag: 'wx'});
            fs.writeFileSync(path.join(root, 'manifest.json'), JSON.stringify({
              schema: 'lasttake/evidence-archive/v1', repository: 'upgradedev/lasttake-aws',
              original_run_id: run.id, original_artifact_id: source.id, original_artifact_name: source.name,
              original_head_sha: run.head_sha, original_created_at: source.created_at,
              source_artifact_digest: source.digest ?? null, archive_sha256: crypto.createHash('sha256').update(bytes).digest('hex'),
              archive_bytes: bytes.length, preserved_by_run_id: context.runId,
              note: 'Original archive bytes only. No extraction or execution. Hash identifies bytes, not truth of claims.'
            }, null, 2), {flag: 'wx'});
            core.setOutput('needed', 'true');
      - uses: actions/upload-artifact@v4
        if: steps.archive.outputs.needed == 'true'
        with:
          name: preserved-aws-acceptance-34359050749-10107569851
          path: ${{ runner.temp }}/lasttake-previous-acceptance/
          retention-days: 90
          if-no-files-found: error
          overwrite: false
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_DEFAULT_REGION: eu-west-1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin npm resolver in CI
        run: npm install --global npm@11.19.1
      - name: Resolve a lock only when absent
        working-directory: frontend
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-lock-${{ github.sha }}
          path: frontend/package-lock.json
          retention-days: 90
      - name: Install locked frontend and Python dependencies in CI
        run: |
          npm ci --prefix frontend
          python -m pip install -e '.[dev]'
      - name: Build React static application
        id: build
        working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist/
          retention-days: 90
      - name: Capture full audit and enforce zero runtime vulnerabilities
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: frontend
        run: |
          mkdir -p test-results/audit
          npm audit --json > test-results/audit/full.json || true
          npm audit --omit=dev --audit-level=low --json > test-results/audit/runtime.json || true
          node scripts/check-audit.mjs test-results/audit/full.json test-results/audit/runtime.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-audit-${{ github.sha }}
          path: frontend/test-results/audit/
          retention-days: 90
          if-no-files-found: error
      - name: Python regression suite
        if: ${{ !cancelled() }}
        run: python -m pytest --durations=20 --cov --cov-fail-under=85 --cov-report=xml:frontend/test-results/python-coverage.xml --junitxml=frontend/test-results/python.xml
      - name: Unit and component coverage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: frontend
        run: npm test
      - name: Functional contracts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: frontend
        run: npm run test:functional
      - name: Source measurement instrument negative fixtures (no measured cohort)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: frontend
        run: node --test tests/hero-measurement.test.mjs
      - name: Fetch the fixed already-spent cohort as inert bytes, never remeasure
        # Branch-scoped review evidence: artifact expiry must not become a mainline dependency.
        if: github.ref == 'refs/heads/codex/hero-measurement-20260910' || github.head_ref == 'codex/hero-measurement-20260910'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 10154044857
          run-id: 34481212393
          github-token: ${{ github.token }}
          path: frontend/test-results/hero-benchmark-spent
          merge-multiple: true
      - name: Replay original hashes and statistics through isolated snapshot finalization
        if: github.ref == 'refs/heads/codex/hero-measurement-20260910' || github.head_ref == 'codex/hero-measurement-20260910'
        working-directory: frontend
        run: node scripts/replay-hero-measurement.mjs test-results/hero-benchmark-spent test-results/hero-benchmark-replay
      - name: Retain source-only replay without another measured attempt
        if: always() && (github.ref == 'refs/heads/codex/hero-measurement-20260910' || github.head_ref == 'codex/hero-measurement-20260910')
        uses: actions/upload-artifact@v4
        with:
          name: source-hero-replay-${{ github.sha }}-${{ github.run_id }}
          path: frontend/test-results/hero-benchmark-replay/
          retention-days: 90
          if-no-files-found: error
          overwrite: false
      - name: Claim evidence and media-source syntax without provider calls
        if: ${{ !cancelled() }}
        run: |
          mkdir -p frontend/test-results/claims
          PYTHONPATH=src python tools/ablation.py > frontend/test-results/claims/ablation.txt
          node --check web/video/capture-production.mjs
      - name: Browser runtime in CI only
        id: browser
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: frontend
        run: python ../.github/scripts/install-playwright-chromium.py
      - name: Real Python API and desktop/mobile user journeys
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser.outcome == 'success' }}
        working-directory: frontend
        run: npm run test:e2e
      - name: Anonymous acceptance page and refusal cases in desktop/mobile browsers
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser.outcome == 'success' }}
        working-directory: frontend
        run: npx playwright test --config playwright.proof.config.ts --forbid-only
      - name: Exercise receipt parser on actual source-run product JUnit without publishing
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: python infra/frontend_acceptance.py inspect-junit
      - name: Secret and prose regressions
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          scanned_head="$(git rev-parse HEAD)"
          echo "History before scan: $(git rev-parse --is-shallow-repository)"
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --unshallow --no-recurse-submodules origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          fi
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git rev-parse HEAD)" = "$scanned_head"
          python tools/secret_scan.py --all-history
          python tools/prose_gate.py
      - name: Reviewable UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-${{ github.sha }}
          path: frontend/test-results/**/*.png
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-evidence-${{ github.sha }}
          path: |
            frontend/test-results/
            frontend/coverage/
            frontend/playwright-report/
            frontend/proof-report/
            frontend/UAT.testbook.json
            frontend/UAT.testbook.html
          retention-days: 90
