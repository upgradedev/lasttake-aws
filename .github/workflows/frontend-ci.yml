name: frontend-ci
on:
  push:
    branches: ["codex/ui-20260909"]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_DEFAULT_REGION: eu-west-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve a lock only when absent
        working-directory: frontend
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-lock-${{ github.sha }}
          path: frontend/package-lock.json
      - name: Install locked frontend and Python dependencies in CI
        run: |
          npm ci --prefix frontend
          python -m pip install -e '.[dev]'
      - name: Python regression suite
        run: python -m pytest --cov --cov-fail-under=85 --cov-report=xml:frontend/test-results/python-coverage.xml --junitxml=frontend/test-results/python.xml
      - name: Build React static application
        working-directory: frontend
        run: npm run build
      - name: Unit and component coverage
        working-directory: frontend
        run: npm test
      - name: Functional contracts
        working-directory: frontend
        run: npm run test:functional
      - name: Browser runtime in CI only
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Real Python API and desktop/mobile user journeys
        working-directory: frontend
        run: npm run test:e2e
      - name: Secret and prose regressions
        run: |
          python tools/secret_scan.py
          python tools/prose_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-evidence-${{ github.sha }}
          path: |
            frontend/test-results/
            frontend/coverage/
            frontend/playwright-report/
            frontend/UAT.testbook.json
            frontend/UAT.testbook.html
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist/
