AWSTemplateFormatVersion: "2010-09-09"
Description: >
  LastTake. Pre-wrap shoot-day assurance. One Lambda behind an HTTP API, one
  Aurora DSQL cluster holding run state, one bucket holding artifacts, the event
  log and the Strands sessions, and one EventBridge bus. Every one of them
  scales to zero, so nothing runs when nobody is looking.

Parameters:
  CodeBucket:
    Type: String
    Description: Bucket holding the deployment zip. Created by the deploy workflow.
  CodeKey:
    Type: String
    Description: Key of the deployment zip, content addressed so a redeploy is a new key.
  CommitSha:
    Type: String
    Default: unknown
    Description: The commit this build came from. Reported by the API so the deployed SHA is checkable against the repo head.
  NamePrefix:
    Type: String
    Default: lasttake
    AllowedPattern: "lasttake[a-z0-9-]*"
    Description: >
      Prefix for every named resource, so a throwaway copy of this stack can exist
      beside the real one without colliding. Must start with `lasttake`, because the
      deploy identity is scoped to `lasttake-*` and a prefix outside that is a stack
      that cannot deploy. Anything other than the default marks the stack ephemeral,
      which relaxes deletion protection so a teardown can actually tear down.
  ModelId:
    Type: String
    Default: global.anthropic.claude-sonnet-5
    Description: Bedrock model or inference profile. Verify with `lasttake doctor --bedrock` before changing.

Conditions:
  # The real stack protects its data. A throwaway copy must be destroyable, or
  # the teardown half of the pipeline can never be proven.
  IsEphemeral: !Not [!Equals [!Ref NamePrefix, "lasttake"]]

Resources:

  # Artifacts, run state, the event log and the Strands sessions.
  #
  # The sessions prefix is the one that matters. A run that stops at 23:10 and
  # resumes at 06:40 crosses a process boundary, and on Lambda /tmp does not
  # survive that gap. This bucket is what makes the pause survivable.
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${NamePrefix}-data-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        # Findings cite source digests. Versioning means a record that was
        # overwritten can still be produced, which is the difference between an
        # audit trail and a claim about one.
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-demo-runs
            Status: Enabled
            Prefix: runs/
            ExpirationInDays: 90
          - Id: expire-demo-sessions
            Status: Enabled
            Prefix: sessions/
            ExpirationInDays: 90
          - Id: drop-old-versions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
      Tags:
        - Key: project
          Value: lasttake

  # Deny anything that is not TLS. The bucket holds names of people in a
  # fictional production, and it should behave as if they were real.
  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub "${DataBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # Run state: findings, human decisions, eligibility packets, the audit trail,
  # and the handled-event set that makes a duplicate approval harmless.
  #
  # A database rather than more S3, for one reason above the others: the
  # handled-event check is read-modify-write, and on object storage two
  # approvals of the same pickup arriving together can both read "not handled"
  # and both write. That is a duplicate pickup on a real assistant director's
  # board. Here it is one INSERT ... ON CONFLICT and the database decides.
  #
  # DSQL rather than a Postgres you keep alive: it scales to zero with no idle
  # charge and no instance to size, which is the same reason everything else
  # here is serverless. Authentication is IAM, so there is no password in this
  # repository or in the deployed configuration.
  Database:
    Type: AWS::DSQL::Cluster
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # An audit trail should not be one console misclick from gone.
      DeletionProtectionEnabled: !If [IsEphemeral, false, true]
      Tags:
        - Key: project
          Value: lasttake

  # The bus the checkpoint, findings, approvals and turnover are published onto.
  # Another service can subscribe without this application knowing, which is
  # what makes the event claim real rather than decorative.
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "${NamePrefix}-${AWS::AccountId}"
      Tags:
        - Key: project
          Value: lasttake

  # There was an AWS::Events::Archive here. It was removed rather than widening
  # the deploy identity to reach `archive/*`: every event is already written to
  # S3 with its full envelope on the way to the bus, and `EventBridgeBus.replay`
  # reads them back, which is what the audit view and the tests actually use.
  # An archive would have added a permission for a capability we already have.

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${NamePrefix}-api-${AWS::AccountId}"
      RetentionInDays: 30

  # Least privilege in practice. The function can write its own bucket, put
  # events on its own bus, and invoke Anthropic models. It cannot read another
  # bucket, cannot touch another bus, and cannot create anything.
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${NamePrefix}-api-role-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: lasttake-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: OwnBucketOnly
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetObjectVersion
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub "${DataBucket.Arn}/*"
              - Sid: OwnBusOnly
                Effect: Allow
                Action: events:PutEvents
                Resource: !GetAtt EventBus.Arn
              - Sid: DescribeOwnBus
                Effect: Allow
                Action: events:DescribeEventBus
                Resource: !GetAtt EventBus.Arn
              # Connect only. The role cannot create, alter or delete a
              # cluster, so a compromised function cannot destroy the record it
              # is writing to.
              - Sid: ConnectToOurClusterOnly
                Effect: Allow
                Action: dsql:DbConnectAdmin
                Resource: !Sub "arn:aws:dsql:${AWS::Region}:${AWS::AccountId}:cluster/${Database}"
              - Sid: BedrockInferenceOnly
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:Converse
                  - bedrock:ConverseStream
                Resource:
                  - "arn:aws:bedrock:*::foundation-model/anthropic.*"
                  - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*"
              - Sid: OwnLogsOnly
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                # Built by hand rather than with !GetAtt LogGroup.Arn. Reading
                # that attribute makes CloudFormation call logs:DescribeLogGroups,
                # which has no resource-level control, so supporting it would
                # mean granting the deploy identity account-wide log read. The
                # ARN is fully determined by the name we chose, so we write it.
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${NamePrefix}-api-${AWS::AccountId}:*"
      Tags:
        - Key: project
          Value: lasttake

  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: !Sub "${NamePrefix}-api-${AWS::AccountId}"
      Description: LastTake pre-wrap checkpoint API and demo page.
      Runtime: python3.12
      Architectures: [arm64]
      Handler: lasttake.app.handler.handler
      Role: !GetAtt FunctionRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      # Generous because a checkpoint runs 80-odd checks. Note the API Gateway
      # integration caps a single request at 30 seconds regardless, so a slow
      # checkpoint surfaces as a gateway timeout rather than running on unseen.
      Timeout: 120
      MemorySize: 1024
      LoggingConfig:
        LogGroup: !Ref LogGroup
      Environment:
        Variables:
          LASTTAKE_BUCKET: !Ref DataBucket
          LASTTAKE_EVENT_BUS: !Ref EventBus
          LASTTAKE_DSQL_ENDPOINT: !Sub "${Database}.dsql.${AWS::Region}.on.aws"
          LASTTAKE_BEDROCK_MODEL_ID: !Ref ModelId
          LASTTAKE_COMMIT_SHA: !Ref CommitSha
      Tags:
        - Key: project
          Value: lasttake

  # An API Gateway HTTP API rather than a Lambda Function URL.
  #
  # A Function URL was the first choice: one less service, no extra bill, and a
  # judge needs a URL rather than a REST API product. It was replaced because
  # this account refuses anonymous Function URL invocations. Both the real
  # function and a one-line probe function returned
  # `403 AccessDeniedException` with a correct resource policy in place, no
  # SCP and no RCP anywhere in the organization, while the same probe behind an
  # HTTP API answered 200. So the block is on that specific front door, and the
  # architecture routes around it rather than arguing with it.
  #
  # Nothing else changes. The HTTP API uses payload format 2.0, whose event
  # shape is the same `requestContext.http` the Function URL sends, so the
  # handler is untouched.
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${NamePrefix}-api-${AWS::AccountId}"
      Description: The public front door for the LastTake demo.
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST]
        AllowHeaders: [content-type]

  HttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 30000

  # One catch-all route. The handler owns its own routing table, so splitting
  # it across eleven CloudFormation resources would put the same decision in
  # two places and let them drift.
  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "$default"
      Target: !Sub "integrations/${HttpIntegration}"

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ApiFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*"

Outputs:
  LiveUrl:
    Description: The URL a judge opens. No account, no install, no credential.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
  BucketName:
    Description: Artifacts, the event log and the Strands sessions.
    Value: !Ref DataBucket
  DatabaseEndpoint:
    Description: Aurora DSQL. Findings, decisions, packets, audit and the handled-event set.
    Value: !Sub "${Database}.dsql.${AWS::Region}.on.aws"
  DatabaseIdentifier:
    Value: !Ref Database
  FunctionName:
    Value: !Sub "${NamePrefix}-api-${AWS::AccountId}"
  IsEphemeral:
    Description: Whether this stack is a throwaway copy that teardown may destroy.
    Value: !If [IsEphemeral, "yes", "no"]
  EventBusName:
    Value: !Ref EventBus
  DeployedSha:
    Description: Compare against the repository head before recording anything.
    Value: !Ref CommitSha
