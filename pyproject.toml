[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lasttake"
version = "0.1.0"
description = "Pre-wrap shoot-day assurance for the production-to-post handoff."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "strands-agents>=1.53.0",
    "boto3>=1.34",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
lasttake = "lasttake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/lasttake"]
omit = [
    # Exercised only against a live Bedrock endpoint. Counting it would inflate
    # the number with lines no test can reach offline, which is the coverage
    # equivalent of inferring a pass from absent evidence.
    "src/lasttake/adapters/aws/bedrock_interpreter.py",
]

[tool.coverage.report]
show_missing = true
