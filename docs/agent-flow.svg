<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">LastTake agent and decision flow</title>
  <desc id="desc">The API or CLI starts one Strands orchestrator directly. Eight tools include four bounded evidence checks, a deterministic eligibility gate, two separate human interrupt tools and turnover publication. S3 persists the interrupted session so another process can resume it. New evidence reruns only affected checks and invalidates stale decisions. Domain events are also sent to EventBridge, where a separate delivery-recorder Lambda writes immutable consumption receipts. That subscriber observes delivery and never starts or resumes the Strands workflow. The public demo uses a scripted planner and lexical interpreter; separate deployment and operator proof uses two scoped Bedrock interpreter agents.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#51647b"/>
    </marker>
    <marker id="human-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#a35f12"/>
    </marker>
    <marker id="event-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#b45309"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #14263b; }
    .title { font-size: 31px; font-weight: 700; }
    .subtitle { font-size: 17px; fill: #51647b; }
    .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.4px; fill: #51647b; }
    .heading { font-size: 18px; font-weight: 700; }
    .body { font-size: 15px; fill: #334a61; }
    .small { font-size: 13px; fill: #51647b; }
    .card { fill: #ffffff; stroke: #9bacbd; stroke-width: 1.6; }
    .agent { fill: #eef2ff; stroke: #6d64b8; stroke-width: 2; }
    .tool { fill: #edf7ff; stroke: #4387a8; stroke-width: 1.6; }
    .gate { fill: #f8fafc; stroke: #23364a; stroke-width: 2.2; }
    .human { fill: #fff7e6; stroke: #b66a15; stroke-width: 2; }
    .store { fill: #ecfdf5; stroke: #27846f; stroke-width: 1.8; }
    .event { fill: #fff4e5; stroke: #d07817; stroke-width: 1.8; }
    .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; stroke-dasharray: 8 6; }
    .flow { fill: none; stroke: #51647b; stroke-width: 2.3; marker-end: url(#arrow); }
    .flow-human { fill: none; stroke: #a35f12; stroke-width: 2.5; marker-end: url(#human-arrow); }
    .flow-event { fill: none; stroke: #b45309; stroke-width: 2.2; marker-end: url(#event-arrow); }
    .flow-dashed { fill: none; stroke: #51647b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
  </style>

  <rect x="1" y="1" width="1198" height="918" rx="24" fill="#f8fafc" stroke="#d7e0e9" stroke-width="2"/>
  <rect x="34" y="34" width="7" height="54" rx="3.5" fill="#d9902f"/>
  <text x="60" y="61" class="title">Agent and decision flow</text>
  <text x="60" y="88" class="subtitle">Strands orchestrates. Deterministic policy and named people decide.</text>

  <rect x="28" y="116" width="1144" height="292" rx="18" class="lane"/>
  <text x="48" y="142" class="eyebrow">CHECKPOINT AND EVIDENCE</text>

  <g filter="url(#shadow)">
    <rect x="48" y="166" width="210" height="104" rx="13" class="card"/>
    <text x="66" y="195" class="heading">Checkpoint request</text>
    <text x="66" y="220" class="body">API or CLI starts Strands</text>
    <text x="66" y="244" class="small">and records the domain event</text>

    <rect x="298" y="158" width="228" height="120" rx="13" class="agent"/>
    <text x="316" y="187" class="eyebrow">STRANDS AGENTS SDK</text>
    <text x="316" y="216" class="heading">Orchestrator Agent</text>
    <text x="316" y="241" class="body">one agent · eight tools</text>
    <text x="316" y="263" class="small">runs work, never decides</text>

    <rect x="566" y="150" width="310" height="136" rx="13" class="tool"/>
    <text x="584" y="179" class="heading">Four bounded check tools</text>
    <rect x="584" y="195" width="127" height="32" rx="7" fill="#ffffff" stroke="#8dc0d8"/>
    <text x="599" y="216" class="body">coverage</text>
    <rect x="726" y="195" width="132" height="32" rx="7" fill="#ffffff" stroke="#8dc0d8"/>
    <text x="741" y="216" class="body">continuity</text>
    <rect x="584" y="237" width="127" height="32" rx="7" fill="#ffffff" stroke="#8dc0d8"/>
    <text x="599" y="258" class="body">media identity</text>
    <rect x="726" y="237" width="132" height="32" rx="7" fill="#ffffff" stroke="#8dc0d8"/>
    <text x="741" y="258" class="body">rights</text>

    <polygon points="926,158 1124,158 1150,218 1124,278 926,278 900,218" class="gate"/>
    <text x="1025" y="199" class="heading" text-anchor="middle">Eligibility gate</text>
    <text x="1025" y="225" class="body" text-anchor="middle">plain code · no model</text>
    <text x="1025" y="250" class="small" text-anchor="middle">absent or stale blocks</text>
  </g>

  <path d="M258 218H296" class="flow"/>
  <path d="M526 218H564" class="flow"/>
  <path d="M876 218H898" class="flow"/>

  <rect x="48" y="308" width="308" height="84" rx="12" class="card"/>
  <text x="66" y="335" class="heading">Interpreter boundary</text>
  <text x="66" y="360" class="small">public: scripted planner + lexical interpreter</text>
  <text x="66" y="382" class="small">deploy/operator proof: two Bedrock Agents</text>
  <path d="M356 350H374V294H412V280" class="flow-dashed"/>
  <path d="M523 316V294H480V280" class="flow-dashed"/>

  <rect x="398" y="316" width="250" height="68" rx="12" class="store"/>
  <text x="416" y="342" class="heading">S3 session manager</text>
  <text x="416" y="365" class="small">resume after process death</text>

  <rect x="690" y="308" width="238" height="84" rx="12" class="human"/>
  <text x="708" y="335" class="eyebrow">TOOLCONTEXT.INTERRUPT</text>
  <text x="708" y="360" class="heading">Pickup, then wrap</text>
  <text x="708" y="381" class="small">two separate approvals</text>

  <rect x="968" y="308" width="184" height="84" rx="12" class="human"/>
  <text x="986" y="337" class="heading">1st AD</text>
  <text x="986" y="361" class="body">reviews exact evidence</text>
  <text x="986" y="382" class="small">authority stays human</text>

  <path d="M1025 278V294H809V306" class="flow-human"/>
  <path d="M928 350H966" class="flow-human"/>
  <path d="M648 350H688" class="flow-dashed"/>

  <rect x="28" y="432" width="1144" height="230" rx="18" class="lane"/>
  <text x="48" y="458" class="eyebrow">CHANGE, RESUME AND HANDOFF</text>

  <rect x="48" y="486" width="248" height="112" rx="13" class="card" filter="url(#shadow)"/>
  <text x="66" y="516" class="heading">New take or release</text>
  <text x="66" y="542" class="body">source digest changes</text>
  <text x="66" y="566" class="small">old decision becomes stale</text>
  <text x="66" y="587" class="small">rerun only affected checks</text>

  <rect x="370" y="486" width="248" height="112" rx="13" class="agent" filter="url(#shadow)"/>
  <text x="388" y="516" class="heading">Resume the tool</text>
  <text x="388" y="542" class="body">stored answer + same run</text>
  <text x="388" y="566" class="small">body replays from line one</text>
  <text x="388" y="587" class="small">effect follows idempotency key</text>

  <rect x="692" y="486" width="218" height="112" rx="13" class="event" filter="url(#shadow)"/>
  <text x="710" y="516" class="heading">Approved action</text>
  <text x="710" y="542" class="body">pickup or wrap event</text>
  <text x="710" y="566" class="small">one durable attempt</text>
  <text x="710" y="587" class="small">outcome stays explicit</text>

  <rect x="984" y="486" width="168" height="112" rx="13" class="store" filter="url(#shadow)"/>
  <text x="1002" y="516" class="heading">Turnover</text>
  <text x="1002" y="542" class="body">sealed manifest</text>
  <text x="1002" y="566" class="small">source map + accepted</text>
  <text x="1002" y="587" class="small">exceptions for editorial</text>

  <path d="M296 542H368" class="flow"/>
  <path d="M618 542H690" class="flow-human"/>
  <path d="M910 542H982" class="flow"/>
  <path d="M296 500H318V418H721V288" class="flow-dashed"/>
  <path d="M1060 392V430H494V484" class="flow-human"/>

  <rect x="28" y="686" width="1144" height="178" rx="18" class="lane"/>
  <text x="48" y="712" class="eyebrow">EVENTBRIDGE DELIVERY OBSERVATION · NOT A WORKFLOW TRIGGER</text>

  <rect x="48" y="740" width="185" height="84" rx="12" class="event"/>
  <text x="65" y="769" class="heading">Domain event</text>
  <text x="65" y="794" class="small">stored before publish</text>

  <rect x="270" y="740" width="185" height="84" rx="12" class="event"/>
  <text x="287" y="769" class="heading">EventBridge</text>
  <text x="287" y="794" class="small">custom bus + rule</text>

  <rect x="492" y="732" width="216" height="100" rx="12" class="event"/>
  <text x="509" y="762" class="heading">Recorder Lambda</text>
  <text x="509" y="787" class="small">validates envelope + key</text>
  <text x="509" y="809" class="small">bounded retry, no PutEvents</text>

  <rect x="745" y="732" width="196" height="100" rx="12" class="store"/>
  <text x="762" y="762" class="heading">S3 receipt</text>
  <text x="762" y="787" class="small">immutable create-once</text>
  <text x="762" y="809" class="small">duplicate verifies existing</text>

  <rect x="978" y="732" width="174" height="100" rx="12" class="card"/>
  <text x="995" y="762" class="heading">History</text>
  <text x="995" y="787" class="small">consumed or</text>
  <text x="995" y="809" class="small">not observed</text>

  <path d="M233 782H268" class="flow-event"/>
  <path d="M455 782H490" class="flow-event"/>
  <path d="M708 782H743" class="flow-event"/>
  <path d="M941 782H976" class="flow"/>

  <text x="600" y="893" class="small" text-anchor="middle">Event consumption proves that the observer ran. It does not prove editorial delivery or start the Strands workflow.</text>
</svg>
