<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">LastTake: know what still blocks wrap before the set comes down</title>
  <desc id="desc">Editorial product banner. Scene evidence flows through a durable Strands workflow to a decision owned by the first assistant director and a verifiable editorial handoff. This is an illustration, not a product screenshot or execution proof.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07111f"/>
      <stop offset="1" stop-color="#182342"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f3b760"/>
      <stop offset="0.58" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#6ee7b7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#020617" flood-opacity="0.34"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#93a4c4"/>
    </marker>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <path d="M40 332H1160" stroke="url(#rule)" stroke-width="3"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(48 40)">
      <rect width="42" height="42" rx="10" fill="#f3b760"/>
      <path d="M13 10v22h17" fill="none" stroke="#07111f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M21 20h10" fill="none" stroke="#07111f" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="106" y="57" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="3.5">LASTTAKE</text>
    <text x="106" y="81" fill="#9fb0ca" font-size="13" letter-spacing="2.2">PRE-WRAP SHOOT-DAY ASSURANCE</text>

    <rect x="891" y="42" width="261" height="38" rx="19" fill="#202d4a" stroke="#526482"/>
    <text x="914" y="67" fill="#dbeafe" font-size="14" font-weight="700" letter-spacing="0.7">STRANDS AGENTS + AWS</text>

    <text x="48" y="135" fill="#f8fafc" font-size="40" font-weight="700">Know what still blocks wrap.</text>
    <text x="48" y="182" fill="#f3b760" font-size="40" font-weight="700">Before the set comes down.</text>
    <text x="49" y="216" fill="#cbd5e1" font-size="17">Source-backed scene assurance for script supervisors and first assistant directors.</text>

    <g transform="translate(48 241)" filter="url(#shadow)">
      <rect width="323" height="63" rx="12" fill="#111c32" stroke="#465775"/>
      <text x="19" y="26" fill="#7dd3fc" font-size="13" font-weight="700" letter-spacing="1.6">01 / SCENE EVIDENCE</text>
      <text x="19" y="49" fill="#eef2ff" font-size="16">Script, takes, media and rights</text>
    </g>
    <path d="M380 272h28m-8-8 8 8-8 8" fill="none" stroke="#93a4c4" stroke-width="2"/>

    <g transform="translate(420 241)" filter="url(#shadow)">
      <rect width="328" height="63" rx="12" fill="#202547" stroke="#776da9"/>
      <text x="19" y="26" fill="#c4b5fd" font-size="13" font-weight="700" letter-spacing="1.6">02 / STRANDS WORKFLOW</text>
      <text x="19" y="49" fill="#eef2ff" font-size="16">Eight tools. Two durable pauses.</text>
    </g>
    <path d="M757 272h28m-8-8 8 8-8 8" fill="none" stroke="#93a4c4" stroke-width="2"/>

    <g transform="translate(797 241)" filter="url(#shadow)">
      <rect width="355" height="63" rx="12" fill="#123a39" stroke="#3f8779"/>
      <text x="19" y="26" fill="#86efcf" font-size="13" font-weight="700" letter-spacing="1.6">03 / HUMAN HANDOFF</text>
      <text x="19" y="49" fill="#eef2ff" font-size="16">The 1st AD decides. Editorial verifies.</text>
    </g>
  </g>
</svg>
