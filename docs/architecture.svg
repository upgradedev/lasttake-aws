<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760"
     font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>LastTake architecture: one shoot day, from a wrap checkpoint to a sealed turnover</title>
  <desc>For script supervisors and the 1st AD: https://d3kf6hquzlli8g.cloudfront.net/, a React workspace served as static files from S3 through CloudFront, calling the API at /api/* through API Gateway. Create a run, checkpoint, inspect sources and answer the saved request. Default offline interpretation uses real Strands replay. No footage/audio analysis or downstream completion is established. Required disclosures: README. A wrap checkpoint event reaches an orchestrator on AWS Lambda. Four bounded checks read
  immutable artifacts from S3 and write sealed findings to Aurora DSQL. A deterministic gate, with
  no model in it, combines the findings and either refuses or emits an eligibility result. Two
  material transitions suspend the run and wait for a named human role, and the run resumes in a
  different process. An approved action publishes to EventBridge and the turnover service seals a
  versioned manifest for editorial.</desc>

  <!-- an explicit ground, so the diagram reads on a dark README as well as a light one -->
  <rect width="1180" height="760" fill="#fbfaf7"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/>
    </marker>
  </defs>

  <style>
    .box  { stroke:#d8d5ce; stroke-width:1.5; rx:7; }
    .t    { fill:#16181d; font-size:14px; }
    .tb   { fill:#16181d; font-size:14.5px; font-weight:650; }
    .s    { fill:#6b7280; font-size:11.5px; }
    .lbl  { fill:#6b7280; font-size:11px; }
    .hd   { fill:#6b7280; font-size:11px; letter-spacing:1.4px; }
    .ln   { stroke:#6b7280; stroke-width:1.4; fill:none; marker-end:url(#a); }
    .lnh  { stroke:#8a5a00; stroke-width:2.2; fill:none; marker-end:url(#ah); }
    .mono { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:11.5px; fill:#3d434c; }
  </style>

  <text x="34" y="40" class="tb" font-size="19">LastTake, one shoot day</text>
  <text x="34" y="61" class="s">Pre-wrap assurance for a script supervisor. Every box below is deployed. The amber path is the one that does not port.</text>

  <!-- 1. the trigger -->
  <text x="34" y="104" class="hd">1 A REAL EVENT</text>
  <rect x="34" y="114" width="212" height="78" class="box" fill="#fff"/>
  <text x="48" y="138" class="tb">scene.wrap-checkpoint</text>
  <text x="48" y="157" class="t">.requested</text>
  <text x="48" y="178" class="s">23:10. The unit starts to strike.</text>

  <path d="M246 153 H300" class="ln"/>

  <!-- 2. orchestrator -->
  <text x="310" y="104" class="hd">2 ORCHESTRATION, DECIDES NOTHING</text>
  <rect x="310" y="114" width="240" height="78" class="box" fill="#fff"/>
  <text x="324" y="138" class="tb">Orchestrator</text>
  <text x="324" y="157" class="s">Strands Agents SDK on Lambda</text>
  <text x="324" y="176" class="s">arm64, behind an HTTP API</text>

  <!-- 0. the surface a judge opens: static files, one API origin -->
  <text x="600" y="104" class="hd">0 THE WORKSPACE A JUDGE OPENS</text>
  <rect x="600" y="114" width="546" height="78" class="box" fill="#fff"/>
  <text x="614" y="138" class="tb">React workspace, static files on S3 behind CloudFront</text>
  <text x="614" y="157" class="s">origin access control, versioned assets, HTML switched last; every release names its commit</text>
  <text x="614" y="176" class="mono">/api/* → API Gateway → the Lambda below · /release.json and /acceptance.json are public receipts</text>
  <path d="M600 153 H550" class="ln"/>

  <path d="M430 192 V232" class="ln"/>

  <!-- 3. the four checks -->
  <text x="34" y="256" class="hd">3 FOUR BOUNDED CHECKS</text>
  <g>
    <rect x="34" y="266" width="176" height="70" class="box" fill="#fbeaea"/>
    <text x="48" y="290" class="tb">Coverage</text>
    <text x="48" y="309" class="s">required beats against</text>
    <text x="48" y="325" class="s">the takes captured</text>

    <rect x="222" y="266" width="176" height="70" class="box" fill="#fdf3e0"/>
    <text x="236" y="290" class="tb">Continuity</text>
    <text x="236" y="309" class="s">preferred takes that</text>
    <text x="236" y="325" class="s">would constrain the edit</text>

    <rect x="410" y="266" width="176" height="70" class="box" fill="#fdf3e0"/>
    <text x="424" y="290" class="tb">Metadata</text>
    <text x="424" y="309" class="s">slate, media, sound,</text>
    <text x="424" y="325" class="s">lens reconciliation</text>

    <rect x="598" y="266" width="176" height="70" class="box" fill="#efeafb"/>
    <text x="612" y="290" class="tb">Rights</text>
    <text x="612" y="309" class="s">every person and asset</text>
    <text x="612" y="325" class="s">traced to a record</text>
  </g>
  <text x="34" y="356" class="s">Coverage and continuity ask a model two bounded questions through a narrow port. Metadata and rights are arithmetic and never call one.</text>
  <text x="34" y="374" class="s">A model can withhold a pass. It cannot manufacture one: every failure path returns <tspan class="mono">unknown</tspan>, which is an exception.</text>

  <!-- artifacts -->
  <rect x="820" y="252" width="326" height="98" class="box" fill="#fff"/>
  <text x="834" y="276" class="tb">S3, immutable artifacts</text>
  <text x="834" y="296" class="s">script revision, shot plan, takes, camera and</text>
  <text x="834" y="313" class="s">sound reports, continuity refs, rights ledger</text>
  <text x="834" y="336" class="mono">every finding cites the sha256 it read</text>
  <path d="M820 300 H784" class="ln"/>

  <path d="M404 336 V386" class="ln"/>

  <!-- 4. findings store -->
  <text x="310" y="410" class="hd">4 SEALED FINDINGS</text>
  <text x="34" y="410" class="hd">8 EDITORIAL RECEIVES</text>
  <rect x="310" y="420" width="336" height="82" class="box" fill="#fff"/>
  <text x="324" y="444" class="tb">Aurora DSQL</text>
  <text x="324" y="464" class="s">findings, decisions, packets, audit, handled events</text>
  <text x="324" y="484" class="mono">record_sha256 verified before the gate reads a field</text>

  <path d="M478 502 V546" class="ln"/>

  <!-- 5. the gate -->
  <text x="310" y="570" class="hd">5 DETERMINISTIC GATE, NO MODEL</text>
  <rect x="310" y="580" width="336" height="96" class="box" fill="#fff" stroke="#137a4c" stroke-width="2.5"/>
  <text x="324" y="604" class="tb">Eligibility gate</text>
  <text x="324" y="624" class="s">Discards a finding whose seal fails or whose sources moved.</text>
  <text x="324" y="642" class="s">Fails closed six ways. Absent evidence is never a pass.</text>
  <text x="324" y="663" class="mono">emits wrap.eligible, which is not authority</text>

  <!-- 6. the human, the hero path -->
  <path d="M646 628 H716" class="lnh"/>
  <text x="716" y="570" class="hd" fill="#8a5a00">6 THE PAUSE, AND THE RESUME</text>
  <rect x="716" y="580" width="216" height="96" class="box" fill="#fdf3e0" stroke="#8a5a00" stroke-width="2"/>
  <text x="730" y="604" class="tb">A named human</text>
  <text x="730" y="623" class="s">1st AD approves a pickup</text>
  <text x="730" y="640" class="s">and, separately, the wrap</text>
  <text x="730" y="661" class="mono">the process then ends</text>

  <path d="M824 580 V520 H960" class="lnh"/>
  <rect x="960" y="480" width="186" height="82" class="box" fill="#fdf3e0" stroke="#8a5a00" stroke-width="2"/>
  <text x="974" y="504" class="tb">Resume, hours later</text>
  <text x="974" y="523" class="s">a different process, from</text>
  <text x="974" y="540" class="s">the session on S3</text>
  <text x="974" y="556" class="mono">ToolContext.interrupt</text>

  <!-- 7. approved action and turnover -->
  <path d="M1053 480 V420" class="ln"/>
  <rect x="820" y="360" width="326" height="60" class="box" fill="#fff"/>
  <text x="834" y="384" class="tb">7 EventBridge, an approved action</text>
  <text x="834" y="404" class="s">bus acceptance only; retry definite rejection only</text>

  <path d="M820 402 H296 V420" class="ln"/>
  <rect x="34" y="420" width="248" height="82" class="box" fill="#e8f4ed"/>
  <text x="48" y="444" class="tb">Turnover to editorial</text>
  <text x="48" y="464" class="s">versioned, sealed, naming every</text>
  <text x="48" y="481" class="s">source it was built from</text>

  <!-- footer -->
  <text x="34" y="712" class="s">A new take changes the takes digest, so the findings that read it go stale and only those rerun. The narrowing is derived from which bytes moved, never asserted from a table.</text>
  <text x="34" y="732" class="s">Pending or unknown publication requires reconciliation, never blind resend. Hashes identify bytes, not factual truth.</text>
</svg>
