<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">LastTake architecture on AWS</title>
  <desc id="desc">A browser loads the React workspace from a private S3 bucket through CloudFront. API calls pass through API Gateway to a Lambda function running a Strands orchestrator. Four bounded checks read the bundled scene package and S3 amendments, then store findings and decisions in Aurora DSQL. A deterministic gate makes no model call and pauses for a named human through ToolContext interrupt. S3 holds sessions, amendments and turnovers. EventBridge accepts run events but has no rule or subscriber. The public path uses an offline lexical interpreter; Amazon Bedrock is used only by a deploy proof and a credentialed operator CLI.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <marker id="humanArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#b45309"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-size: 27px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 15px; fill: #475569; }
    .lane-title { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; fill: #475569; }
    .heading { font-size: 16px; font-weight: 700; fill: #0f172a; }
    .body { font-size: 13px; fill: #475569; }
    .small { font-size: 12px; fill: #64748b; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; fill: #475569; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .aws { fill: #fff7ed; stroke: #f59e0b; stroke-width: 1.5; }
    .agent { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.5; }
    .store { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; }
    .rule { fill: #f8fafc; stroke: #334155; stroke-width: 2; }
    .human { fill: #fffbeb; stroke: #b45309; stroke-width: 2; }
    .limit { fill: #fff1f2; stroke: #e11d48; stroke-width: 1.5; }
    .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.25; stroke-dasharray: 7 6; }
    .line { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .line-dashed { fill: none; stroke: #64748b; stroke-width: 1.7; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .line-human { fill: none; stroke: #b45309; stroke-width: 2.4; marker-end: url(#humanArrow); }
  </style>

  <rect x="1" y="1" width="1198" height="758" rx="24" fill="#f8fafc" stroke="#dbe3ed" stroke-width="2"/>

  <text x="34" y="46" class="title">LastTake on AWS</text>
  <text x="34" y="72" class="subtitle">One shoot day, from cited evidence to a human-approved turnover</text>

  <g transform="translate(722,28)">
    <rect x="0" y="0" width="18" height="18" rx="4" class="aws"/>
    <text x="26" y="14" class="small">AWS service</text>
    <rect x="126" y="0" width="18" height="18" rx="4" class="agent"/>
    <text x="152" y="14" class="small">Strands or check</text>
    <rect x="288" y="0" width="18" height="18" rx="4" class="rule"/>
    <text x="314" y="14" class="small">plain-code gate</text>
    <rect x="0" y="28" width="18" height="18" rx="4" class="store"/>
    <text x="26" y="42" class="small">state or artifact</text>
    <rect x="126" y="28" width="18" height="18" rx="4" class="human"/>
    <text x="152" y="42" class="small">human authority</text>
    <rect x="288" y="28" width="18" height="18" rx="4" class="limit"/>
    <text x="314" y="42" class="small">not connected</text>
  </g>

  <rect x="24" y="100" width="1152" height="580" rx="18" class="lane"/>
  <text x="42" y="124" class="lane-title">AWS REGION EU-WEST-1</text>

  <!-- Public delivery path -->
  <text x="42" y="164" class="lane-title">PUBLIC DELIVERY PATH</text>

  <rect x="42" y="180" width="176" height="78" rx="12" class="box" filter="url(#shadow)"/>
  <text x="58" y="210" class="heading">Browser</text>
  <text x="58" y="233" class="body">no account</text>
  <text x="58" y="250" class="small">synthetic session</text>

  <rect x="258" y="180" width="190" height="78" rx="12" class="aws" filter="url(#shadow)"/>
  <text x="274" y="210" class="heading">CloudFront</text>
  <text x="274" y="233" class="body">React app and API routes</text>
  <text x="274" y="250" class="small">uncached /api requests</text>

  <rect x="488" y="180" width="190" height="78" rx="12" class="aws" filter="url(#shadow)"/>
  <text x="504" y="210" class="heading">API Gateway</text>
  <text x="504" y="233" class="body">HTTP API</text>
  <text x="504" y="250" class="small">session-scoped routes</text>

  <rect x="718" y="170" width="230" height="98" rx="12" class="agent" filter="url(#shadow)"/>
  <text x="734" y="201" class="heading">Lambda orchestrator</text>
  <text x="734" y="224" class="body">Strands Agents SDK</text>
  <text x="734" y="244" class="mono">one agent · eight tools</text>
  <text x="734" y="261" class="small">orchestrates, never decides</text>

  <path d="M218 219H256" class="line"/>
  <path d="M448 219H486" class="line"/>
  <path d="M678 219H716" class="line"/>

  <rect x="258" y="286" width="190" height="64" rx="12" class="store"/>
  <text x="274" y="312" class="heading">Private S3 site</text>
  <text x="274" y="334" class="body">CloudFront OAC only</text>
  <path d="M353 284V260" class="line"/>

  <!-- Evidence and decision path -->
  <text x="42" y="392" class="lane-title">EVIDENCE AND DECISION PATH</text>

  <rect x="42" y="410" width="214" height="112" rx="12" class="store" filter="url(#shadow)"/>
  <text x="58" y="440" class="heading">Scene evidence</text>
  <text x="58" y="463" class="body">7 source groups</text>
  <text x="58" y="484" class="small">bundled corpus plus</text>
  <text x="58" y="502" class="small">session amendments on S3</text>

  <rect x="296" y="392" width="276" height="148" rx="12" class="agent" filter="url(#shadow)"/>
  <text x="312" y="422" class="heading">Four bounded checks</text>
  <rect x="312" y="440" width="112" height="32" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="328" y="461" class="body">coverage</text>
  <rect x="436" y="440" width="120" height="32" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="451" y="461" class="body">continuity</text>
  <rect x="312" y="482" width="112" height="32" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="328" y="503" class="body">media identity</text>
  <rect x="436" y="482" width="120" height="32" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="451" y="503" class="body">rights</text>
  <text x="312" y="532" class="small">each finding cites source SHA-256</text>

  <rect x="612" y="410" width="188" height="112" rx="12" class="store" filter="url(#shadow)"/>
  <text x="628" y="440" class="heading">Aurora DSQL</text>
  <text x="628" y="463" class="body">findings · decisions</text>
  <text x="628" y="484" class="body">packets · audit</text>
  <text x="628" y="505" class="small">sealed records</text>

  <polygon points="840,410 1006,410 1024,466 1006,522 840,522 822,466" class="rule" filter="url(#shadow)"/>
  <text x="851" y="447" class="heading">Eligibility gate</text>
  <text x="851" y="470" class="body">no model call</text>
  <text x="851" y="491" class="small">stale or absent evidence</text>
  <text x="851" y="509" class="small">cannot become a pass</text>

  <rect x="1054" y="400" width="104" height="132" rx="12" class="human" filter="url(#shadow)"/>
  <text x="1070" y="431" class="heading">1st AD</text>
  <text x="1070" y="454" class="body">pickup</text>
  <text x="1070" y="474" class="body">then wrap</text>
  <text x="1070" y="500" class="small">two separate</text>
  <text x="1070" y="518" class="small">interrupts</text>

  <path d="M256 466H294" class="line"/>
  <path d="M572 466H610" class="line"/>
  <path d="M800 466H820" class="line"/>
  <path d="M1024 466H1052" class="line-human"/>
  <path d="M833 268V364H434V390" class="line"/>

  <!-- Runtime boundaries -->
  <rect x="42" y="570" width="318" height="82" rx="12" class="box"/>
  <text x="58" y="597" class="heading">Interpreter port</text>
  <text x="58" y="620" class="body">public: offline lexical matcher</text>
  <text x="58" y="640" class="body">deploy proof and operator CLI: Bedrock</text>
  <path d="M360 611H434V542" class="line-dashed"/>

  <rect x="400" y="570" width="258" height="82" rx="12" class="store"/>
  <text x="416" y="597" class="heading">S3 data bucket</text>
  <text x="416" y="620" class="body">sessions · amendments</text>
  <text x="416" y="640" class="body">events · turnovers</text>
  <path d="M658 611H833V270" class="line-dashed"/>

  <rect x="698" y="570" width="230" height="82" rx="12" class="aws"/>
  <text x="714" y="597" class="heading">EventBridge</text>
  <text x="714" y="620" class="body">run-event acceptance</text>
  <text x="714" y="640" class="small">no rule · no subscriber</text>
  <path d="M948 219H1004V611H930" class="line-dashed"/>

  <rect x="968" y="570" width="190" height="82" rx="12" class="store"/>
  <text x="984" y="597" class="heading">Turnover</text>
  <text x="984" y="620" class="body">sealed and versioned</text>
  <text x="984" y="640" class="small">saved after wrap approval</text>
  <path d="M1106 532V568" class="line-human"/>

  <rect x="24" y="700" width="1152" height="38" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="42" y="724" class="body">Current trigger: the API or CLI records the checkpoint event, then invokes the orchestrator directly. EventBridge does not trigger the run.</text>
</svg>
