<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">LastTake deployed architecture on AWS</title>
  <desc id="desc">CloudFront serves the React workspace from a private S3 site and routes uncached API requests through API Gateway to a Lambda function running one Strands orchestrator with eight tools. Aurora DSQL stores run state, findings and decisions. S3 stores supplied artifacts, suspended sessions, event envelopes and turnovers. The public route uses a scripted planner and lexical interpreter; separate deployment and operator proof uses Amazon Bedrock through two scoped interpreter agents. The browser caches only the application shell and one last-confirmed read-only snapshot, while one tab-scoped evidence draft may survive a disconnected reload. It never caches API responses or queues authority actions, and reconnect performs authoritative reads rather than replaying writes. Domain events go to an EventBridge custom bus and rule, then a separate least-privilege delivery-recorder Lambda writes immutable S3 consumption receipts. The recorder observes delivery only and never starts or resumes the Strands workflow.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#51647b"/>
    </marker>
    <marker id="event-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#b45309"/>
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #14263b; }
    .title { font-size: 31px; font-weight: 700; }
    .subtitle { font-size: 17px; fill: #51647b; }
    .lane-title { font-size: 13px; font-weight: 700; letter-spacing: 1.4px; fill: #51647b; }
    .heading { font-size: 18px; font-weight: 700; }
    .body { font-size: 15px; fill: #334a61; }
    .small { font-size: 13px; fill: #51647b; }
    .mono { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #334a61; }
    .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; stroke-dasharray: 8 6; }
    .client { fill: #f8fafc; stroke: #8295a8; stroke-width: 1.7; }
    .offline { fill: #f2f4f8; stroke: #66788c; stroke-width: 1.6; }
    .aws { fill: #fff4e5; stroke: #d07817; stroke-width: 1.8; }
    .agent { fill: #eef2ff; stroke: #6d64b8; stroke-width: 2; }
    .store { fill: #ecfdf5; stroke: #27846f; stroke-width: 1.8; }
    .human { fill: #fff7e6; stroke: #a35f12; stroke-width: 2; }
    .proof { fill: #edf7ff; stroke: #4387a8; stroke-width: 1.7; }
    .flow { fill: none; stroke: #51647b; stroke-width: 2.3; marker-end: url(#arrow); }
    .flow-dashed { fill: none; stroke: #51647b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    .flow-event { fill: none; stroke: #b45309; stroke-width: 2.3; marker-end: url(#event-arrow); }
  </style>

  <rect x="1" y="1" width="1198" height="918" rx="24" fill="#f8fafc" stroke="#d7e0e9" stroke-width="2"/>
  <rect x="34" y="34" width="7" height="54" rx="3.5" fill="#d9902f"/>
  <text x="60" y="61" class="title">LastTake on AWS</text>
  <text x="60" y="88" class="subtitle">Deployed online path, bounded offline continuity and independent event delivery observation</text>

  <rect x="28" y="116" width="1144" height="264" rx="18" class="lane"/>
  <text x="48" y="143" class="lane-title">PUBLIC CLIENT AND REQUEST PATH</text>

  <rect x="48" y="164" width="316" height="188" rx="14" class="client" filter="url(#shadow)"/>
  <text x="68" y="194" class="heading">Browser · React workspace</text>
  <text x="68" y="220" class="body">No account · synthetic session</text>
  <rect x="66" y="238" width="280" height="94" rx="10" class="offline"/>
  <text x="82" y="262" class="lane-title">BOUNDED OFFLINE CLIENT</text>
  <text x="82" y="286" class="small">cached shell + one confirmed snapshot</text>
  <text x="82" y="307" class="small">one tab-scoped evidence draft</text>
  <text x="82" y="328" class="small">read-only · no queued authority or replay</text>

  <rect x="408" y="176" width="188" height="92" rx="13" class="aws" filter="url(#shadow)"/>
  <text x="426" y="207" class="heading">CloudFront</text>
  <text x="426" y="232" class="body">site + API routes</text>
  <text x="426" y="254" class="small">API responses never cached</text>

  <rect x="638" y="176" width="188" height="92" rx="13" class="aws" filter="url(#shadow)"/>
  <text x="656" y="207" class="heading">API Gateway</text>
  <text x="656" y="232" class="body">session-scoped HTTP API</text>
  <text x="656" y="254" class="small">authoritative reads + writes</text>

  <rect x="868" y="164" width="284" height="116" rx="13" class="agent" filter="url(#shadow)"/>
  <text x="888" y="193" class="lane-title">AWS LAMBDA</text>
  <text x="888" y="221" class="heading">Strands orchestrator</text>
  <text x="888" y="246" class="body">one Agent · eight tools</text>
  <text x="888" y="267" class="small">API starts it directly</text>

  <rect x="408" y="294" width="188" height="62" rx="11" class="store"/>
  <text x="426" y="320" class="heading">Private S3 site</text>
  <text x="426" y="343" class="small">CloudFront OAC only</text>

  <path d="M364 222H406" class="flow"/>
  <path d="M596 222H636" class="flow"/>
  <path d="M826 222H866" class="flow"/>
  <path d="M502 292V270" class="flow"/>

  <rect x="28" y="404" width="1144" height="262" rx="18" class="lane"/>
  <text x="48" y="431" class="lane-title">AGENT EXECUTION, HUMAN AUTHORITY AND DURABLE STATE</text>

  <rect x="48" y="458" width="244" height="164" rx="13" class="proof" filter="url(#shadow)"/>
  <text x="66" y="487" class="heading">Interpreter port</text>
  <text x="66" y="515" class="lane-title">PUBLIC DEMO</text>
  <text x="66" y="539" class="body">scripted planner</text>
  <text x="66" y="561" class="body">lexical interpreter</text>
  <text x="66" y="589" class="lane-title">DEPLOY / OPERATOR PROOF</text>
  <text x="66" y="613" class="small">Bedrock · two scoped Agents</text>

  <rect x="330" y="458" width="266" height="164" rx="13" class="agent" filter="url(#shadow)"/>
  <text x="348" y="487" class="heading">Eight bounded tools</text>
  <text x="348" y="514" class="body">coverage · continuity</text>
  <text x="348" y="538" class="body">media identity · rights</text>
  <text x="348" y="562" class="body">eligibility · two interrupts</text>
  <text x="348" y="586" class="body">turnover publication</text>
  <text x="348" y="611" class="small">deterministic gate makes no model call</text>

  <rect x="634" y="458" width="232" height="76" rx="12" class="store"/>
  <text x="652" y="487" class="heading">Aurora DSQL</text>
  <text x="652" y="512" class="small">runs · findings · decisions · audit</text>

  <rect x="904" y="458" width="248" height="76" rx="12" class="store"/>
  <text x="922" y="487" class="heading">S3 durable records</text>
  <text x="922" y="512" class="small">evidence · sessions · turnovers</text>

  <rect x="634" y="560" width="232" height="74" rx="12" class="human"/>
  <text x="652" y="589" class="heading">Named human roles</text>
  <text x="652" y="614" class="small">pickup and wrap stay separate</text>

  <rect x="904" y="560" width="248" height="74" rx="12" class="store"/>
  <text x="922" y="589" class="heading">S3SessionManager</text>
  <text x="922" y="614" class="small">resume after Lambda process death</text>

  <path d="M868 280V422H463V456" class="flow"/>
  <path d="M292 540H328" class="flow-dashed"/>
  <path d="M596 496H632" class="flow"/>
  <path d="M596 576H614V597H632" class="flow"/>
  <path d="M866 496H902" class="flow"/>
  <path d="M1028 560V536" class="flow-dashed"/>

  <rect x="28" y="690" width="1144" height="178" rx="18" class="lane"/>
  <text x="48" y="716" class="lane-title">EVENT DELIVERY OBSERVER · SEPARATE FROM WORKFLOW EXECUTION</text>

  <rect x="48" y="744" width="190" height="84" rx="12" class="aws"/>
  <text x="66" y="773" class="heading">EventBridge bus</text>
  <text x="66" y="798" class="small">domain event accepted</text>

  <rect x="278" y="744" width="164" height="84" rx="12" class="aws"/>
  <text x="296" y="773" class="heading">Rule</text>
  <text x="296" y="798" class="small">known source only</text>

  <rect x="482" y="736" width="248" height="100" rx="12" class="aws"/>
  <text x="500" y="765" class="heading">Recorder Lambda</text>
  <text x="500" y="790" class="small">validates schema + identity</text>
  <text x="500" y="812" class="small">no Strands · no PutEvents</text>

  <rect x="770" y="736" width="214" height="100" rx="12" class="store"/>
  <text x="788" y="765" class="heading">S3 receipts</text>
  <text x="788" y="790" class="small">immutable, idempotent</text>
  <text x="788" y="812" class="small">least-privilege prefix</text>

  <rect x="1024" y="736" width="128" height="100" rx="12" class="client"/>
  <text x="1042" y="765" class="heading">History</text>
  <text x="1042" y="790" class="small">consumed</text>
  <text x="1042" y="812" class="small">or not observed</text>

  <path d="M1010 280H1162V700H142V742" class="flow-event"/>
  <path d="M238 786H276" class="flow-event"/>
  <path d="M442 786H480" class="flow-event"/>
  <path d="M730 786H768" class="flow-event"/>
  <path d="M984 786H1022" class="flow"/>

  <text x="600" y="895" class="small" text-anchor="middle">Reconnect reads current server state. Event consumption proves observer execution, not editorial delivery.</text>
</svg>
