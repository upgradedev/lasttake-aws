<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1347" width="880" height="1347">
  <title>LastTake, one shoot day: from a wrap checkpoint to a turnover for editorial</title>
  <desc>The React workspace is static files on S3 behind CloudFront, and /api/* goes to API Gateway, then Lambda. The Run wrap checkpoint button, or the lasttake checkpoint command, records the event scene.wrap-checkpoint.requested and then starts the run itself. The orchestrator is one agent on the Strands Agents SDK on Lambda, arm64, with eight tools, and it decides nothing. Four bounded checks read the scene package bundled with the function (script, shot plan, script notes, camera report, continuity refs, takes and rights ledger) plus amendments stored on S3, and every finding cites the sha256 it read. Metadata compares each take against the camera report and rights traces people and assets against the ledger. Coverage compares required beats against usable takes and continuity compares preferred takes against continuity refs; both ask an interpreter port, which on the live URL is an offline lexical reader that can withhold a pass and never make one. Aurora DSQL holds findings, decisions, packets, audit entries and handled events. Each finding is sealed, and the eligibility gate, which uses no model, verifies that seal and drops a finding whose seal fails or whose cited sources moved. Absent evidence is a finding, never a pass, and wrap.eligible is not authority. On approval.requested the run stops, at 23:10 in this story, and the process ends. A named human, the 1st AD, approves a pickup and, separately, the wrap; hours later, at 06:40, a different process resumes the run from the Strands session on S3 through ToolContext.interrupt. Every run event is published to EventBridge, approvals under an idempotency key; only bus acceptance is recorded and no subscriber is declared. After the wrap approval the turnover for editorial is saved from Handoff, sealed, versioned and naming every source. A late take or a release reruns its listed checks inside the API route; a per-event table picks them, and a take moves the takes digest that every check cites, so all four rerun. Hashes identify bytes, not truth. A pending or unknown publication needs reconciliation, never a blind resend. The amber path is the human pause and resume.</desc>
